<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>فاکتور</title>
<link rel="icon" href="/kit/icon.svg" type="image/svg+xml">
<link rel="preload" href="/kit/fonts/vazirmatn-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/r/receipt.css">
<script src="/r/receipt.js" defer></script>
</head>
<body>
<main id="main" class="receipt-page">
  <section id="loading" class="slip slip-state" aria-live="polite">
    <p class="muted">در حالِ باز کردنِ فاکتور…</p>
  </section>

  <section id="missing" class="slip slip-state" aria-live="polite" hidden>
    <h1>فاکتور</h1>
    <p id="missing-text" class="muted"></p>
    <button id="retry" class="btn" type="button">دوباره</button>
  </section>

  <article id="receipt" class="slip" aria-labelledby="shop-name" hidden>
    <header class="slip-head">
      <img id="shop-logo" class="slip-logo" alt="" hidden>
      <h1 id="shop-name"></h1>
      <p id="shop-address" class="muted" hidden></p>
      <p id="shop-phone" class="muted" hidden></p>
    </header>
    <p id="cancelled" class="slip-banner" role="status" hidden>این فاکتور لغو شد</p>
    <dl id="meta" class="slip-rows"></dl>
    <ol id="items" class="slip-items"></ol>
    <p id="count" class="slip-count muted"></p>
    <dl id="totals" class="slip-rows"></dl>
    <dl id="payments" class="slip-rows"></dl>
    <p id="note" class="slip-note" hidden></p>
    <p id="footer" class="slip-footer muted" hidden></p>
  </article>
</main>
</body>
</html>
