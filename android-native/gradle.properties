org.gradle.jvmargs=-Xmx3072m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------
#  نشانیِ سرور — همان که در نسخه‌ی دستِ کاربر می‌نشیند.
#
#  **تنها راهِ رسیدنِ نشانی به برنامه همین است.** کادرِ «آدرس سرور» از
#  تنظیمات و از صفحه‌ی ورود برداشته شده و برنامه هیچ راهی برای عوض
#  کردنِ سرور ندارد؛ هر نصبِ تازه از لحظه‌ی اول به همین نشانی وصل است.
#
#  خالی یعنی نسخه به هیچ سروری بسته نیست: برنامه کامل آفلاین کار
#  می‌کند ولی حساب، اشتراک و همگام‌سازی در آن نیست — و هنگام ساخت
#  هشدار داده می‌شود.
#
#  فقط https (مگر در نسخه‌ی آزمایشی)، بدون `/api/v1` و بدون `/` آخر:
#    tohid.apiBase=https://api.example.com
#
#  متغیرِ محیطیِ TOHID_API_BASE بالاتر از این می‌نشیند، اگر خواستید یک
#  بیلدِ خاص را جای دیگری ببرید.
# ---------------------------------------------------------------
tohid.apiBase=https://api.vill3n.top

#  نشانیِ نسخه‌ی آزمایشی (رایانه‌ی خودتان). مثال:
#    tohid.apiBase.dev=http://192.168.1.5:3000
tohid.apiBase.dev=

# ---------------------------------------------------------------
#  شناسه‌ی این برنامه نزدِ سرورِ مرکزی.
#
#  سرورِ مرکزی یکی است و چند برنامه از آن احراز هویت می‌گیرند. هر
#  درخواستِ ورود می‌گوید مالِ کدام برنامه است، و سرور نشست را به همان
#  بخش مهر می‌زند: توکنِ یک برنامه در برنامه‌ی دیگر **پیدا نمی‌شود**.
#
#  مقدارهایی که سرور امروز می‌شناسد (`server/src/lib/tenancy.js`):
#      shop   دکان — همین برنامه
#      pump   پمپ‌بنزین
#
#  ⚠️ نامِ ناشناخته را سرور رد می‌کند، پس این را سرخود عوض نکنید؛ اول
#  بخشش باید در `tenancy.js` تعریف شود.
#
#  تا دیروز این مقدار هیچ‌جا فرستاده نمی‌شد و برنامه به پیش‌فرضِ سرور
#  («نگفتی، پس دکانی») تکیه می‌کرد — و در چند جا هم رشته‌ی `"shop"`
#  مستقیم داخلِ کد نوشته شده بود.
# ---------------------------------------------------------------
tohid.appId=shop
