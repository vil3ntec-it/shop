org.gradle.jvmargs=-Xmx3072m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---------------------------------------------------------------
#  نشانیِ سرور — همان که در نسخه‌ی دستِ کاربر می‌نشیند.
#
#  وقتی این پر باشد، برنامه از لحظه‌ی نصب سرور را دارد: کادرِ «آدرس
#  سرور» اصلاً ساخته نمی‌شود، کاربر نه آن را می‌بیند و نه می‌تواند
#  برنامه را به سرورِ دیگری ببرد.
#
#  خالی یعنی نسخه به هیچ سروری بسته نیست و کاربر باید نشانی را دستی
#  بزند — برای نسخه‌ی دستِ فروشنده، این را پر کنید.
#
#  فقط https (مگر در نسخه‌ی آزمایشی)، بدون `/api/v1` و بدون `/` آخر:
#    tohid.apiBase=https://api.example.com
#
#  متغیرِ محیطیِ TOHID_API_BASE بالاتر از این می‌نشیند، اگر خواستید یک
#  بیلدِ خاص را جای دیگری ببرید.
# ---------------------------------------------------------------
tohid.apiBase=

#  نشانیِ نسخه‌ی آزمایشی (رایانه‌ی خودتان). مثال:
#    tohid.apiBase.dev=http://192.168.1.5:3000
tohid.apiBase.dev=
