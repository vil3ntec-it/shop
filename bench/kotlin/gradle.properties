#  همان حافظهٔ desktop/gradle.properties: سنجشِ موتورها core را کامل کامپایل می‌کند و با پیش‌فرضِ Gradle
#  روی رانرِ CI «GC overhead limit exceeded» می‌داد (perf.yml، #1032)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
