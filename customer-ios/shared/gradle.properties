#  کامپایلِ Kotlin/Native ِ هزاران فایلِ Compose حافظه می‌خواهد (همان دلیلِ desktop/gradle.properties)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
kotlin.code.style=official
#  کامپایلِ klib برای iOS روی لینوکس هم (بی Xcode) — فقط برای بررسیِ سریعِ خطاها؛ پیوند و xcodebuild فقط روی macOS
kotlin.native.enableKlibsCrossCompilation=true
