name: شواهدِ آزمون‌های Gradle (GATE-NEW-05)

# GATE-NEW-05 (§۳۵): «برای هر تست شناسه، build/commit، محیط، دستگاه/نسخه، … گام‌های بازتولید، خروجیِ واقعی و نتیجه».
# سرور این را از پیش دارد (`test-evidence-*` ِ server.yml)؛ این ورک‌فلو همان را برای آزمون‌های Gradle می‌سازد: همهٔ آزمون‌های
# کامپیوتر (که آزمون‌های `android-native/app/src/test` را هم می‌دواند — هر آزمونِ «ساخت نسخهٔ بومی» این‌جا هم هست) و core،
# سپس `tools/test-evidence/gradle-evidence.mjs` گزارش‌های JUnit XML ِ خودِ Gradle را به یک خطِ JSONL برای هر آزمون
# (شناسهٔ `<کلاس>#<نام>`، commit، JDK، سیستم‌عامل، نتیجه، زمان، دستورِ بازتولید، خروجیِ شکست/SKIP) در artifact ِ
# `test-evidence-gradle` می‌برد.
#
# ⛔ `tohid-desktop.yml` و `tohid-native.yml` انتشاری‌اند و دست نمی‌خورند، و `workflow_run` در workflow-guard ممنوع است ⇒
# این ورک‌فلو فقط آزمون است: هیچ نصاب، APK، artifact ِ منتشرشدنی یا مجوزِ نوشتنی ندارد.
# ⛔ صفِ Actions (#329): روی main فقط وقتی کدِ Kotlin عوض شده؛ PR فقط وقتی خودِ این ورک‌فلو یا مبدل عوض شود؛ و دستی.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android-native/app/src/**'
      - 'core/**'
      - 'android-native/gradle.properties'
      - 'tools/test-evidence/**'
      - '.github/workflows/gradle-evidence.yml'
  pull_request:
    paths:
      - 'tools/test-evidence/**'
      - '.github/workflows/gradle-evidence.yml'
  workflow_dispatch:

concurrency:
  #  شواهدِ تازه‌ترین commit بس است: push ِ تازه اجرای قبلیِ همان شاخه/PR را لغو می‌کند
  group: gradle-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evidence:
    name: آزمون‌های Gradle با شواهد (کامپیوتر + core)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      #  نامِ آزمون‌ها فارسی است؛ بی UTF-8 کامپایلر نامِ فایلِ کلاس را نمی‌سازد (همان tohid-desktop.yml)
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      #  پیش از ده دقیقه آزمون: مبدل خودش سالم است
      - name: آزمونِ مبدلِ شواهد
        run: node --test tools/test-evidence/gradle-evidence.test.mjs

      - id: java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: آزمون‌های کامپیوتر (و android-native/app/src/test)
        working-directory: desktop
        run: ./gradlew --no-daemon test

      #  آزمونِ سرخِ کامپیوتر جلوی شواهدِ core را نمی‌گیرد؛ خودِ کار سرخ می‌ماند. ولی بی JDK ِ ۱۷ نه: اگر گامِ مبدل سرخ شد و
      #  setup-java رد شد، Gradle با JDK ِ پیش‌فرضِ runner (۲۵) بالا می‌آید و خطای بی‌ربط می‌دهد (#1040)
      - name: آزمون‌های core
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        working-directory: core
        run: ../desktop/gradlew --no-daemon test

      - name: شواهد (JSONL)
        if: ${{ !cancelled() }}
        run: >-
          node tools/test-evidence/gradle-evidence.mjs --out "$RUNNER_TEMP/evidence/gradle.jsonl"
          desktop=desktop/build/test-results/test core=core/build/test-results/jvmTest

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-evidence-gradle
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30
