name: customer-ios

#  برنامهٔ خریدِ مشتری روی آیفون (O-04 «ب»، مرحلهٔ ۲): همان صفحه‌های Compose ِ `customer-android` در پوستهٔ
#  `customer-ios/shared` (چارچوبِ TohidCustomer) و `customer-ios/iosApp` (SwiftUI) — همان الگوی `ios-spike.yml` ِ برنامهٔ دکان.
#  ⛔ همه «(گزارش)» و `continue-on-error`؛ هیچ‌کدام سدِ ادغام نیستند. بی رمز، بی امضا، بی انتشار (امضا و شناسهٔ تیم با
#  اجازهٔ صاحب‌کار، docs/IOS-PLAN-fa.md §۰.۶). فقط در PR و فقط وقتی برنامهٔ خرید یا کارخواهِ مشترکش عوض شده.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'customer-android/**'
      - 'customer-ios/**'
      - 'core/src/commonMain/kotlin/ir/vil3ntec/tohid/core/shopper/**'
      - '.github/workflows/customer-ios.yml'

concurrency:
  group: customer-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  #  klib ِ شبیه‌ساز روی لینوکس (بی Xcode؛ `kotlin.native.enableKlibsCrossCompilation` در customer-ios/shared/gradle.properties):
  #  هر java.*/android.* ِ تازه در صفحه‌های مشترک یا مرزِ `*Ios.kt` همین‌جا خطا می‌دهد، پیش از دقیقه‌های مک
  customer-ios-klib:
    name: برنامهٔ خرید روی آیفون — klib روی لینوکس (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-customer-${{ runner.os }}-${{ hashFiles('customer-ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      - name: compileKotlinIosSimulatorArm64 (customer-ios/shared)
        run: ./desktop/gradlew --no-daemon -p customer-ios/shared -Pios=true compileKotlinIosSimulatorArm64

  #  macOS: چارچوب، برنامهٔ Xcode برای شبیه‌سازِ arm64 بی امضا، یک بار اجرا با عکس، و پیوندِ عمیقِ `tohidshop://`
  #  (برنامه پس از باز کردنِ پیوند هنوز زنده است). هر گام سخت‌گیر است؛ کار «گزارش» است.
  customer-ios-app:
    name: برنامهٔ خرید روی آیفون — چارچوب، Xcode و شبیه‌ساز (گزارش)
    runs-on: macos-latest
    timeout-minutes: 75
    continue-on-error: true
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-customer-${{ runner.os }}-${{ hashFiles('customer-ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      - name: linkDebugFrameworkIosSimulatorArm64 (customer-ios/shared)
        run: ./desktop/gradlew --no-daemon -p customer-ios/shared -Pios=true linkDebugFrameworkIosSimulatorArm64
      #  مرحلهٔ «Compile Kotlin Framework» ِ پروژه همان چارچوب را با embedAndSignAppleFrameworkForXcode برمی‌دارد
      - name: xcodebuild (شبیه‌ساز، بی امضا)
        run: |
          xcodebuild -project customer-ios/iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/customer-ios/iosApp/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ls -la customer-ios/iosApp/build/Debug-iphonesimulator/iosApp.app
      - name: اجرا روی شبیه‌ساز، پیوندِ عمیق و عکس
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" customer-ios/iosApp/build/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" ir.vil3ntec.tohid.customer
          sleep 15
          mkdir -p customer-ios-shots
          xcrun simctl io "$UDID" screenshot customer-ios-shots/home.png
          #  پیوندِ عمیق به یک دکان (سرور در دسترس نیست ⇒ صفحهٔ دکان با خطای روشن، نه کرش)
          xcrun simctl openurl "$UDID" "tohidshop://store/golestan"
          sleep 8
          xcrun simctl io "$UDID" screenshot customer-ios-shots/deep-link.png
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "iosApp"' > customer-ios-shots/app.log 2>&1 || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'ir.vil3ntec.tohid.customer'; then echo "برنامه پس از پیوندِ عمیق زنده است"; else echo "::warning::برنامه زنده نیست (customer-ios-shots/app.log)"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: customer-ios-shots
          path: customer-ios-shots/
          if-no-files-found: ignore
