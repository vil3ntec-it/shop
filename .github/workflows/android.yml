name: Android build

# ⛔ بازنشسته (۱۴۰۵/۰۷/۲۰): پوستهٔ WebViewِ قدیمی. برنامهٔ اندروید بومی است
# (`android-native/`، `tohid-native.yml`) و قاعده این است که اندروید و کامپیوتر
# وب نباشند. این ساخت فقط دستی می‌ماند تا کدِ بایگانی‌شده شکسته نماند.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee tests.log

      - name: Lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      # وقتی بیلد می‌شکند، فقط همان چند خط خطا را نشان بده
      - name: Show errors
        if: failure()
        working-directory: android
        run: |
          echo '--- خطاها ---'
          grep -hE "^e: |^\s+ERROR|error:|What went wrong|Execution failed|FAILURE:" -A 2 *.log | tail -60 || true
          for f in app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E "^(Error|.*: Error)" -A 2 "$f" | head -40
          done || true

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tohid-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
