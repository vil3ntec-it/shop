name: Android build

on:
  push:
    branches: ["**"]
    paths:
      # خود برنامه (همان فایل‌های سایت) داخل بسته می‌رود، پس تغییر آن‌ها
      # هم باید بیلد تازه بسازد
      - "android/**"
      - "index.html"
      - "license/**"
      - "sounds/**"
      - "icons/**"
      - "fonts/**"
      - "manifest.webmanifest"
      - "sw.js"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "index.html"
      - "license/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee tests.log

      - name: Lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      # وقتی بیلد می‌شکند، فقط همان چند خط خطا را نشان بده
      - name: Show errors
        if: failure()
        working-directory: android
        run: |
          echo '--- خطاها ---'
          grep -hE "^e: |^\s+ERROR|error:|What went wrong|Execution failed|FAILURE:" -A 2 *.log | tail -60 || true
          for f in app/build/reports/lint-results-debug.txt; do
            [ -f "$f" ] && grep -E "^(Error|.*: Error)" -A 2 "$f" | head -40
          done || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tohid-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore
