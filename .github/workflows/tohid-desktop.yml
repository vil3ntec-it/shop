name: فروشگاه من — کامپیوتر

#  برنامهٔ کامپیوترِ فروشگاه — همان کدِ `android-native`، روی Compose Desktop.
#  هر تغییری در برنامهٔ اندروید این را هم می‌سازد، چون همان فایل‌هاست.
on:
  push:
    #  شاخه‌های claude/** فقط از راهِ PR سنجیده می‌شوند (اجرای دوتایی صفِ Actions را چند ساعت عقب انداخت)
    branches: [main]
    paths:
      - 'desktop/**'
      - 'install.ps1'
      - 'android-native/app/src/**'
      - 'core/**'
      #  تغییرِ فقط فایل‌های مرجع روی main نسخهٔ آزمایشی نمی‌سازد (در PR سنجیده می‌شود)
      - '!core/test-vectors/**'
      - 'android-native/gradle.properties'
      - '.github/workflows/tohid-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'android-native/app/src/**'
      #  کدِ مشترکِ core و آزمون‌های مرجعِ آن (CoreVectorsTest)
      - 'core/**'
      #  بردارهای مرجعِ مشترک با JS (StockCoreVectorsTest همین‌ها را می‌خواند)
      - 'license/test-vectors/**'
      #  گامِ ۵ِ آزمونِ نصاب (`install.ps1` با PowerShell 5.1) — تا امروز در PR اصلاً نمی‌دوید
      - 'install.ps1'
      #  نشانیِ سرور و AppId ِ ساختِ کامپیوتر از همین پرونده خوانده می‌شود (`desktop/build.gradle.kts`)؛
      #  بی آن PRی که فقط این را عوض کند دروازه‌های AppId و upgradeUuid را نمی‌گذراند
      - 'android-native/gradle.properties'
      - '.github/workflows/tohid-desktop.yml'
  #  ⛔ F0-27: push به main فقط کانالِ آزمایشی (`tohid-desktop-beta`). برچسبِ پایدار
  #  (`tohid-desktop`، همان که همهٔ کامپیوترها و صفحهٔ دانلود می‌خوانند) فقط از
  #  Run workflow ⇒ شاخهٔ main ⇒ channel = stable.
  workflow_dispatch:
    inputs:
      channel:
        description: 'کانال: beta (فقط دکان‌ها و دستگاه‌های آزمایشی) یا stable (همهٔ دکان‌ها)'
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند؛ اجرای main (انتشارِ آزمایشی) و انتشارِ
  #  پایدار هرگز وسطِ کار لغو نمی‌شوند.
  group: tohid-desktop-${{ github.event.pull_request.number || github.ref }}-${{ inputs.channel || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

#  ⛔ §۱۴ (docs/security/supply-fa.md): کامپایل، آزمون و ساختِ نصاب‌ها (کدِ PR و وابستگی‌های Gradle)
#  فقط توکنِ خواندنی دارند؛ `contents: write` فقط در کارِ «انتشار» که هیچ کدِ ساختی اجرا نمی‌کند.
permissions:
  contents: read

jobs:
  check:
    name: کامپایل و آزمون
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      #  نامِ آزمون‌ها فارسی است؛ بی UTF-8 کامپایلر نامِ فایلِ کلاس را نمی‌سازد
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    outputs:
      installer: ${{ steps.installer.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          #  دو commit: در PR، HEAD همان commitِ ادغام است و HEAD^1 سرِ main ⇒ فهرستِ فایل‌های PR (پایین)
          fetch-depth: 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      #  آیا این PR خودِ ساختِ نصاب را عوض کرده؟ آن‌وقت نصاب‌ها بی برچسب هم ساخته و آزموده می‌شوند
      #  (کارِ «نصاب» پایین). اگر فهرست به دست نیاید، محتاطانه «بله».
      - name: آیا نصاب‌ها هم ساخته شوند
        id: installer
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          files=$(git diff --name-only HEAD^1 HEAD) || { echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          re='^(desktop/(installer|setup-all|gradle)/|desktop/(build|settings)\.gradle\.kts$|desktop/gradle\.properties$|install\.ps1$|\.github/workflows/tohid-desktop\.yml$)'
          if grep -qE "$re" <<<"$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=نصاب::این PR ساختِ نصاب را عوض کرده ⇒ نصاب‌ها ساخته و نصب‌شان آزموده می‌شود"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: وابستگی‌ها
        working-directory: desktop
        run: ./gradlew --no-daemon -q resolveDeps

      #  مخزنِ گوگل (`androidx.*`) از بعضی شبکه‌ها بسته است. این بسته همان
      #  فایل‌ها را به‌شکلِ یک مخزنِ Maven می‌دهد تا بشود بی آن مخزن هم ساخت.
      - name: بستهٔ ساختِ آفلاین
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          out="$RUNNER_TEMP/offline-m2"
          cd ~/.gradle/caches/modules-2/files-2.1
          for g in androidx.*; do
            find "$g" -type f | while read -r f; do
              rest=${f#*/}; a=${rest%%/*}; rest=${rest#*/}; v=${rest%%/*}
              dest="$out/${g//.//}/$a/$v"; mkdir -p "$dest"; cp "$f" "$dest/"
            done
          done
          du -sh "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.ref != 'refs/heads/main' }}
        with:
          name: desktop-offline-m2
          path: ${{ runner.temp }}/offline-m2
          retention-days: 5

      - name: کامپایل
        working-directory: desktop
        run: ./gradlew --no-daemon compileKotlin

      #  همان آزمون‌های `android-native/app/src/test` — این‌جا روی JVMِ
      #  کامپیوتر، به‌علاوهٔ آزمون‌های خودِ لایهٔ کامپیوتری.
      - name: آزمون
        working-directory: desktop
        run: ./gradlew --no-daemon test

      #  معیارِ «قدم صفر»ِ ۳.۳: شناسه‌های نصاب ثابت می‌مانند — با شناسهٔ تازه نصاب
      #  کنارِ نسخهٔ قبلی می‌نشیند به‌جای به‌روزرسانی‌اش. شمارِ آزمون‌ها در خلاصهٔ اجرا.
      - name: دروازه‌های نصاب
        working-directory: desktop
        run: |
          fail=0
          grep -qF 'upgradeUuid = "6f1e0c52-7a3b-4d8e-9c1f-3b2a5d7e9f10"' build.gradle.kts || { echo "::error::upgradeUuidِ MSI عوض شد"; fail=1; }
          grep -qF 'AppId={{8C2E4F1A-5B7D-4E3C-9A61-2F0D7B3E5C14}' installer/Tohid.iss || { echo "::error::AppIdِ Inno Setup عوض شد"; fail=1; }
          grep -qF 'bundleID = "ir.vil3ntec.tohid.desktop"' build.gradle.kts || { echo "::error::bundleIDِ مک عوض شد"; fail=1; }
          tests=$(grep -ho '<testsuite [^>]*' build/test-results/test/*.xml | awk '
            { for (i = 1; i <= NF; i++) if (match($i, /^(tests|failures|errors|skipped)="[0-9]+"/)) {
                split($i, kv, "\""); k = substr($i, 1, index($i, "=") - 1); s[k] += kv[2] } }
            END { printf "%d آزمون، %d شکست، %d خطا، %d ردشده", s["tests"], s["failures"], s["errors"], s["skipped"] }')
          printf '### دروازه‌های نصاب (قدم صفرِ ۳.۳)\n\nupgradeUuid، AppIdِ Inno و bundleIDِ مک: %s\n\nآزمون‌ها: %s\n' \
            "$([ $fail = 0 ] && echo بی‌تغییر || echo '**عوض شد**')" "$tests" >> "$GITHUB_STEP_SUMMARY"
          exit $fail

  #  F0-01: روی ویندوز `renameTo` فایلِ موجود را جایگزین نمی‌کند و دفتر از
  #  ذخیرهٔ دوم به بعد به دیسک نمی‌رسید. آزمون‌های ذخیره روی خودِ ویندوز.
  disk-windows:
    name: ذخیره روی دیسکِ ویندوز
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      #  OPS-02: نسخهٔ نیم‌ساعته دفتر را می‌خواند؛ این‌جا روی ویندوزِ واقعی سنجیده
      #  می‌شود که آن خواندن جلوی نوشتنِ دفتر (ثبتِ فروش) را نمی‌گیرد
      - name: آزمونِ ذخیره
        working-directory: desktop
        shell: bash
        #  SEC-01: کوچِ رمزِ دفتر (جایگزینیِ اتمی، کنار گذاشتنِ دفترِ خوانده‌نشده) روی ویندوزِ واقعی
        run: ./gradlew --no-daemon test --tests 'ir.vil3ntec.tohid.desktop.ShopStoreDiskTest' --tests 'ir.vil3ntec.tohid.data.DiskWriteTest' --tests 'ir.vil3ntec.tohid.data.LocalSnapshotsTest' --tests 'ir.vil3ntec.tohid.desktop.AtRestDiskTest' --tests 'ir.vil3ntec.tohid.core.atrest.AtRestTest'

  #  ⛔ ۱۴۰۵/۰۷/۲۷: پنج نصاب (دو ویندوز، دو مک، لینوکس؛ هر کدام تا ۴۰ دقیقه با نصبِ واقعی) روی
  #  **هر** pushِ هر PRِ برنامه گلوگاهِ صفِ Actions بودند. حالا در PR فقط وقتی ساخته می‌شوند که
  #  برچسبِ `build-installer` روی PR باشد (از pushِ بعدی یا close/reopen) یا خودِ PR ساختِ نصاب را
  #  عوض کرده باشد (گامِ «آیا نصاب‌ها هم ساخته شوند» بالا). push به main، Run workflow (هر شاخه‌ای) و
  #  بقیهٔ رویدادها مثلِ قبل همیشه می‌سازند، پس هیچ نصابی بی همین آزمون‌ها منتشر نمی‌شود.
  #  کامپایل و آزمون (`check`) و ذخیره روی ویندوز (`disk-windows`) در هر PR مثلِ قبل می‌دوند.
  package:
    name: نصاب ${{ matrix.label }}
    needs: check
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'build-installer')
      || needs.check.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: ویندوز
            task: packageMsi
            glob: 'build/compose/binaries/main/msi/*.msi'
            fixed: Tohid-Windows.msi
          #  نصابِ اصلیِ ویندوز: Inno Setup روی همان پوشهٔ برنامهٔ jpackage
          #  (‎desktop/installer/Tohid.iss‎ — چرا، همان‌جا نوشته شده)
          - os: windows-2022
            label: ویندوز (Setup.exe)
            task: createDistributable
            inno: true
            fixed: Tohid-Windows-Inno
          #  ⛔ macos-14 از ۲ نوامبر ۲۰۲۶ بازنشسته است (و پیش از آن خاموشی‌های زمان‌بندی‌شده دارد:
          #  actions/runner-images#13518) ⇒ همان arm64 روی macos-15
          - os: macos-15
            label: مک (Apple Silicon)
            task: packageDmg
            glob: 'build/compose/binaries/main/dmg/*.dmg'
            fixed: Tohid-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            label: مک (Intel)
            task: packageDmg
            glob: 'build/compose/binaries/main/dmg/*.dmg'
            fixed: Tohid-Mac-Intel.dmg
          - os: ubuntu-22.04
            label: لینوکس
            task: packageDeb
            glob: 'build/compose/binaries/main/deb/*.deb'
            fixed: Tohid-Linux.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: ساخت نصاب
        working-directory: desktop
        shell: bash
        env:
          TOHID_API_BASE: ${{ vars.TOHID_API_BASE }}
          TOHID_UPDATE_PUBLIC_KEY: ${{ vars.TOHID_UPDATE_PUBLIC_KEY }}
          TOHID_LICENSE_PUBLIC_KEY: ${{ vars.TOHID_LICENSE_PUBLIC_KEY }}
        run: ./gradlew --no-daemon ${{ matrix.task }} -PbuildNumber=${{ github.run_number }}

      #  نصابِ آنلاینِ کوچک + نسخهٔ Offline + بستهٔ برنامه (‎.7z‎) — شرحِ
      #  سناریوها سرِ ‎desktop/installer/Tohid.iss‎. بعد نصبِ واقعی روی همین
      #  ویندوز: هر سه راه (Offline، فایلِ کنارِ نصاب، دانلود و سنجشِ hash)
      #  و ردِ فایلِ خراب — تا نصابی که نصب نمی‌شود هرگز منتشر نشود.
      - name: نصابِ Inno Setup و آزمونِ نصب
        if: ${{ matrix.inno }}
        working-directory: desktop
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (./gradlew --no-daemon -q printVersionName -PbuildNumber=${{ github.run_number }} | Select-Object -Last 1).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $src = (Resolve-Path build/compose/binaries/main/app/Tohid).Path
          New-Item -ItemType Directory -Force out | Out-Null
          $payload = "out/Tohid-Windows-App-$v.7z"
          #  ‎-ms=off‎: بی آن، نصاب هر فایل را از سرِ بلوکِ «solid» باز می‌کرد و ۹۰ مگابایت ×
          #  ۲۳۴ فایل نصب را عملاً قفل می‌کرد (آزمونِ نصب روی همین CI گرفت)
          Write-Host "$(Get-Date -f T) 7z"
          Push-Location $src
          & 7z a -t7z -mx=9 -m0=lzma2 -mf=off -ms=off -bd -bso0 (Join-Path $env:GITHUB_WORKSPACE "desktop/$payload") *
          if ($LASTEXITCODE -ne 0) { throw "7z" }
          Pop-Location
          $sha = (Get-FileHash $payload -Algorithm SHA256).Hash.ToLower()
          $size = (Get-ChildItem $src -Recurse -File | Measure-Object Length -Sum).Sum
          $bytes = (Get-Item $payload).Length
          #  F0-27: نصابِ آنلاین بستهٔ برنامه را از همان برچسبی می‌گیرد که خودش زیرش منتشر می‌شود
          #  (همان قاعدهٔ «کانال»ِ کارِ انتشار: پایدار فقط Run workflow ⇒ channel = stable)
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_CHANNEL -eq 'stable') { 'tohid-desktop' } else { 'tohid-desktop-beta' }
          Write-Host "$(Get-Date -f T) iscc ($tag)"
          & $iscc /Q "/DAppVersion=$v" "/DPayloadSha=$sha" "/DPayloadSize=$size" "/DPayloadBytes=$bytes" "/DReleaseTag=$tag" installer/Tohid.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc online" }
          & $iscc /Q "/DAppVersion=$v" /DOffline installer/Tohid.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc offline" }
          Copy-Item build/installer/Tohid-Windows-Setup.exe, build/installer/Tohid-Windows-Offline.exe out/
          Get-ChildItem out | Format-Table Name, Length

          function Install($exe, $dir, $extra) {
            $a = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOLAUNCH', "/DIR=$dir", "/LOG=$dir.log") + $extra
            #  سقفِ ۶ دقیقه: نصابی که گیر کند گزارشش چاپ می‌شود، نه این‌که کار تا timeout بماند
            Write-Host "$(Get-Date -f T) → $exe $($extra -join ' ')"
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(360000)) {
              Get-Process | Where-Object { $_.Name -match 'Tohid|setup|\.tmp|unins' } | Format-Table Name, Id, MainWindowTitle | Out-String | Write-Host
              Get-Content "$dir.log" -Tail 60 -ErrorAction SilentlyContinue
              Get-Process | Where-Object { $_.Name -match 'Tohid|\.tmp|unins' } | Stop-Process -Force -ErrorAction SilentlyContinue
              $p | Stop-Process -Force -ErrorAction SilentlyContinue
              throw "نصاب گیر کرد: $exe"
            }
            return $p.ExitCode
          }
          function Check($dir, $name) {
            $n = (Get-ChildItem $dir -Recurse -File | Measure-Object).Count
            if (-not (Test-Path "$dir\Tohid.exe") -or $n -lt 50) { Get-Content "$dir.log" -Tail 40; throw "${name}: نصب ناقص ($n فایل)" }
            Write-Host "✓ $name — $n فایل"
            $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru
            if (-not $u.WaitForExit(180000)) { $u | Stop-Process -Force; throw "${name}: حذف گیر کرد" }
            for ($k = 0; $k -lt 30 -and (Test-Path "$dir\app"); $k++) { Start-Sleep 2 }
            if (Test-Path "$dir\app") { throw "${name}: حذف ناقص" }
          }
          $t = "$env:RUNNER_TEMP\it"; New-Item -ItemType Directory -Force $t | Out-Null

          #  ۱) Offline
          if ((Install "out\Tohid-Windows-Offline.exe" "$t\a" @()) -ne 0) { Get-Content "$t\a.log" -Tail 40; throw "offline" }
          #  خودِ برنامه هم باید واقعاً باز شود و بماند. لانچرِ jpackage روی ویندوز یک
          #  ‎Tohid.exe‎ِ فرزند می‌سازد که JVM در آن است — پس همهٔ ‎Tohid.exe‎های این پوشه سنجیده می‌شوند.
          $app = Start-Process -FilePath "$t\a\Tohid.exe" -PassThru
          function Mine { Get-Process -Name Tohid -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$t\a\*" } }
          $mem = 0; $title = ''
          for ($k = 0; $k -lt 45; $k++) {
            Start-Sleep 2
            $ps_ = @(Mine)
            if ($ps_.Count -eq 0) { break }
            $mem = [int](($ps_ | Measure-Object WorkingSet64 -Maximum).Maximum / 1MB)
            $title = ($ps_ | Where-Object { $_.MainWindowTitle } | Select-Object -First 1).MainWindowTitle
            if ($mem -ge 150 -and $title) { break }
          }
          Start-Sleep 8
          $alive = @(Mine).Count
          Write-Host "── Tohid.exe: $alive فرآیند، بیشترین حافظه $mem مگابایت، پنجره «$title»"
          Mine | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 3
          if ($alive -eq 0) { throw "برنامه باز شد و خودش بسته شد" }
          if ($mem -lt 150) { throw "JVMِ برنامه بالا نیامد (حافظه $mem مگابایت)" }
          if ($title -notmatch 'فروشگاه من') { Write-Host "::warning::عنوانِ پنجره «$title» است (روی CI ممکن است پنجره ساخته نشود)" }
          Write-Host "✓ برنامه باز شد و ماند"
          Check "$t\a" "Offline"

          #  ۲) فایلِ برنامه کنارِ نصاب، بی‌اینترنت
          New-Item -ItemType Directory -Force "$t\side" | Out-Null
          Copy-Item out\Tohid-Windows-Setup.exe, $payload "$t\side\"
          if ((Install "$t\side\Tohid-Windows-Setup.exe" "$t\b" @('/PAYLOADURL=http://127.0.0.1:9/none')) -ne 0) { Get-Content "$t\b.log" -Tail 40; throw "local payload" }
          Check "$t\b" "فایلِ کنارِ نصاب"

          #  ۳) دانلود و سنجشِ hash (سرورِ محلی) — با curl.exe، در پوشهٔ ماندگار
          Copy-Item ..\install.ps1 out\
          $srv = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1','--directory',(Resolve-Path out).Path -PassThru
          #  سرورِ Range که هر فایلِ بزرگ را ۳ بار وسطِ راه می‌بُرد (‎installer/test-range-server.py‎)
          $ranges = "$t\ranges.log"
          $rsrv = Start-Process python -ArgumentList '-I',(Resolve-Path installer/test-range-server.py).Path,(Resolve-Path out).Path,'8766','3',$ranges -PassThru
          Start-Sleep 3
          $cache = Join-Path $env:LOCALAPPDATA 'Tohid-setup-cache'
          Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
          #  نصاب در پوشه‌ای بی بسته — وگرنه بستهٔ کنارش را برمی‌داشت و دانلود آزموده نمی‌شد
          New-Item -ItemType Directory -Force "$t\net" | Out-Null
          Copy-Item out\Tohid-Windows-Setup.exe "$t\net\"
          if ((Install "$t\net\Tohid-Windows-Setup.exe" "$t\c" @("/PAYLOADURL=http://127.0.0.1:8765/Tohid-Windows-App-$v.7z")) -ne 0) { Get-Content "$t\c.log" -Tail 40; throw "download" }
          if (Select-String -Path "$t\c.log" -Pattern 'Using local payload' -Quiet) { throw "دانلود آزموده نشد" }
          if (-not (Select-String -Path "$t\c.log" -Pattern 'curl.exe exit 0' -Quiet)) { Get-Content "$t\c.log" -Tail 40; throw "دانلود از راهِ curl.exe نرفت" }
          if (-not (Select-String -Path "$t\c.log" -Pattern "Release tag: $tag" -Quiet)) { throw "نصاب برچسبِ $tag را نمی‌شناسد" }
          if (Test-Path "$cache\Tohid-Windows-App-$v.7z") { throw "پوشهٔ ماندگار پس از نصب پاک نشد" }
          Check "$t\c" "دانلود"

          #  ۳ب) ادامه، نه از صفر: نیمه‌ای از اجرای قبلی (۱۰ مگابایتِ اول) در پوشهٔ ماندگار،
          #  و سرور ۳ بار وسطِ راه می‌بُرد ⇐ نصب کامل، و هیچ درخواستی بی Range (یعنی از صفر) نیست
          New-Item -ItemType Directory -Force $cache | Out-Null
          $head = New-Object byte[] 10485760
          $fs = [IO.File]::OpenRead((Resolve-Path $payload)); [void]$fs.Read($head, 0, $head.Length); $fs.Close()
          [IO.File]::WriteAllBytes("$cache\Tohid-Windows-App-$v.7z", $head)
          if ((Install "$t\net\Tohid-Windows-Setup.exe" "$t\r" @("/PAYLOADURL=http://127.0.0.1:8766/Tohid-Windows-App-$v.7z")) -ne 0) { Get-Content "$t\r.log" -Tail 40; throw "ادامهٔ دانلود" }
          $seen = @(Get-Content $ranges | Where-Object { $_ -like "Tohid-Windows-App-$v.7z *" } | ForEach-Object { ($_ -split ' ', 2)[1] })
          Write-Host "── درخواست‌ها: $($seen -join ' | ')"
          if ($seen.Count -lt 4) { throw "سرور کمتر از ۴ درخواست دید — قطع‌ها آزموده نشدند" }
          if ($seen[0] -ne 'bytes=10485760-') { throw "نیمهٔ قبلی ادامه داده نشد: $($seen[0])" }
          if ($seen -contains '-') { throw "دانلود جایی از صفر شروع شد" }
          if (-not (Select-String -Path "$t\r.log" -Pattern 'Resuming' -Quiet)) { throw "نصاب «ادامه» را گزارش نکرد" }
          Check "$t\r" "ادامهٔ دانلود"

          #  ۴) فایلِ خراب ⇐ باید رد شود، نه نصبِ نیمه‌کاره
          Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
          $bad = "out\bad.7z"; Copy-Item $payload $bad
          $fs = [IO.File]::OpenWrite((Resolve-Path $bad)); $fs.Seek(5000000, 'Begin') | Out-Null; $fs.Write([byte[]](1..64), 0, 64); $fs.Close()
          $code = Install "$t\net\Tohid-Windows-Setup.exe" "$t\d" @('/PAYLOADURL=http://127.0.0.1:8765/bad.7z')
          if ($code -eq 0 -or (Test-Path "$t\d\Tohid.exe")) { throw "فایلِ خراب پذیرفته شد" }
          Select-String -Path "$t\d.log" -Pattern 'SHA-256|hash|failed' -ErrorAction SilentlyContinue | Select-Object -First 3
          Write-Host "✓ فایلِ خراب رد شد (کدِ خروج $code)"
          Remove-Item $bad

          #  ۵) ‎install.ps1‎ (راهِ بی SmartScreen) با Windows PowerShell 5.1 — همان که روی ویندوزِ کاربر است
          Copy-Item out\Tohid-Windows-Setup.exe out\MyShop-Windows-Setup.exe
          (Get-FileHash out\MyShop-Windows-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  MyShop-Windows-Setup.exe" | Set-Content -Encoding ascii out\SHA256SUMS.txt
          #  همان سرورِ Range که فایلِ بزرگ (نصاب) را ۳ بار وسطِ راه می‌بُرد ⇐ install.ps1 هم ادامه می‌دهد
          Remove-Item $cache -Recurse -Force -ErrorAction SilentlyContinue
          $env:TOHID_INSTALL_SRC = 'http://127.0.0.1:8766'
          $env:TOHID_INSTALL_ARGS = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOLAUNCH /DIR=$t\e /LOG=$t\e.log /PAYLOADURL=http://127.0.0.1:8765/Tohid-Windows-App-$v.7z"
          #  مسیرِ ماژول‌های pwsh 7 به powershell 5.1 نرسد — مثلِ ویندوزِ کاربر
          $env:PSModulePath = [Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $ps = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-Command',"irm http://127.0.0.1:8765/install.ps1 | iex" -PassThru -NoNewWindow
          if (-not $ps.WaitForExit(360000)) { $ps | Stop-Process -Force; throw "install.ps1 گیر کرد" }
          if (-not (Test-Path "$t\e\Tohid.exe")) { throw "install.ps1 نصب نکرد" }
          $seen = @(Get-Content $ranges | Where-Object { $_ -like 'MyShop-Windows-Setup.exe *' } | ForEach-Object { ($_ -split ' ', 2)[1] })
          Write-Host "── install.ps1: $($seen -join ' | ')"
          if ($seen.Count -lt 4 -or ($seen | Select-Object -Skip 1) -contains '-') { throw "install.ps1 پس از قطع از صفر شروع کرد" }
          Check "$t\e" "install.ps1"
          Remove-Item out\SHA256SUMS.txt, out\install.ps1, out\MyShop-Windows-Setup.exe
          Stop-Process -Id $srv.Id -Force
          Stop-Process -Id $rsrv.Id -Force

      - name: گزارشِ jpackage
        if: ${{ failure() }}
        working-directory: desktop
        shell: bash
        run: find build/compose/logs -type f -name '*.txt' -exec sh -c 'echo "== $1"; tail -n 60 "$1"' _ {} \;

      - name: نام‌گذاری
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p out
          if [ -z "${{ matrix.inno }}" ]; then
            f=$(ls ${{ matrix.glob }} | head -n1)
            cp "$f" "out/${{ matrix.fixed }}"
          fi
          ./gradlew --no-daemon -q printVersionName -PbuildNumber=${{ github.run_number }} | tail -n1 > out/version.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.fixed }}
          path: ${{ matrix.inno && 'desktop/out/Tohid-Windows-*' || format('desktop/out/{0}', matrix.fixed) }}
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        with:
          name: desktop-version
          path: desktop/out/version.txt
          retention-days: 30

  #  انتشار فقط از `main` — همان قاعدهٔ «مرج ⇒ انتشار».
  #  فایل‌ها یکی‌یکی و `version.txt` آخر (همان درسِ «Error saving asset»ِ
  #  برنامهٔ اندروید): هیچ لحظه‌ای شماره‌ای اعلام نمی‌شود که فایلش نیامده.
  publish:
    name: انتشار
    needs: package
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: desktop/setup-all
          #  توکنِ نوشتنی در ‎.git/config‎ نماند؛ گام‌ها خودشان GH_TOKEN می‌گیرند
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      #  پایدار فقط با workflow_dispatch و channel = stable؛ هر push ⇒ آزمایشی
      - name: کانال
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_CHANNEL" = "stable" ]; then
            printf 'CHANNEL=stable\nTAG=tohid-desktop\n' >> "$GITHUB_ENV"
          else
            printf 'CHANNEL=beta\nTAG=tohid-desktop-beta\n' >> "$GITHUB_ENV"
          fi

      - name: برچسب
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
                 -f sha='${{ github.sha }}' -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha='${{ github.sha }}' >/dev/null
          fi

      - name: انتشارِ آزمایشی
        if: ${{ env.CHANNEL == 'beta' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: tohid-desktop-beta
          name: فروشگاه من — کامپیوتر، نسخهٔ آزمایشی (beta)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ## نسخهٔ آزمایشی — فقط دکان‌ها و دستگاه‌های آزمایشی

            هر مرج به main این‌جا می‌آید، نه روی کامپیوترِ همه. دکانی که شناسه‌اش در
            `live_config` (scope `release`، کلیدِ `beta.shops` یا `beta.devices`) باشد
            این نسخه را از به‌روزرسانیِ داخلِ برنامه می‌گیرد. انتشارِ پایدار برای همه فقط
            با Run workflow ⇒ channel = stable.

            نصبِ دستی: [MyShop-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/tohid-desktop-beta/MyShop-Windows-Setup.exe)
            (آنلاین؛ بستهٔ برنامه را از همین انتشارِ آزمایشی می‌گیرد و اگر اینترنت قطع شود از همان‌جا ادامه می‌دهد)
            یا [MyShop-Windows-Offline.exe](https://github.com/${{ github.repository }}/releases/download/tohid-desktop-beta/MyShop-Windows-Offline.exe) (بی‌اینترنت).

            ---
            <sub>ساخته‌شده از `${{ github.sha }}`</sub>

      - name: انتشار
        if: ${{ env.CHANNEL == 'stable' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: tohid-desktop
          name: فروشگاه من — برنامهٔ کامپیوتر
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ## فروشگاه من — برنامهٔ کامپیوتر (ویندوز · مک · لینوکس)

            همان برنامهٔ گوشی، بومی روی کامپیوتر — Kotlin و Compose، بی مرورگر و بی WebView.
            همان حساب، همان دکان، همان اشتراک.

            **یک نصاب برای همهٔ کامپیوترها:** [MyShop-Setup-All.zip](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Setup-All.zip) — باز کنید و نصب‌کنندهٔ سیستمِ خودتان را بزنید (مک نوعِ تراشه را خودش تشخیص می‌دهد).

            | سیستم | دانلود |
            |---|---|
            | ویندوز ۱۰ و ۱۱ (نصاب، پیشنهادی) | [MyShop-Windows-Setup.exe](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Windows-Setup.exe) |
            | ویندوز ۱۰ و ۱۱ (بی‌اینترنت) | [MyShop-Windows-Offline.exe](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Windows-Offline.exe) |
            | مک (M1 و تازه‌تر) | [MyShop-Mac-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Mac-AppleSilicon.dmg) |
            | مک (Intel) | [MyShop-Mac-Intel.dmg](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Mac-Intel.dmg) |
            | لینوکس (دبیان/اوبونتو) | [MyShop-Linux.deb](https://github.com/${{ github.repository }}/releases/download/tohid-desktop/MyShop-Linux.deb) |

            > مک: بارِ اول روی برنامه راست‌کلیک ⇒ Open (نسخه هنوز امضای اپل ندارد).

            ---
            <sub>ساخته‌شده از `${{ github.sha }}`</sub>

      - name: فرستادنِ فایل‌ها — یکی‌یکی، version.txt آخر
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.TOHID_UPDATE_SIGNING_KEY }}
          TOHID_UPDATE_PUBLIC_KEY: ${{ vars.TOHID_UPDATE_PUBLIC_KEY }}
          TOHID_LICENSE_PUBLIC_KEY: ${{ vars.TOHID_LICENSE_PUBLIC_KEY }}
        run: |
          set -e
          up() {
            for i in 1 2 3; do
              if gh release upload "$TAG" "$1" --clobber -R "${{ github.repository }}"; then return 0; fi
              sleep $((i * 5))
            done
            echo "::error::فرستادنِ $1 نشد"; return 1
          }
          #  بستهٔ برنامهٔ ویندوز پیش از نصابِ آنلاین که آن را می‌خواهد؛ نامش نسخه دارد
          #  تا نصابِ کهنه‌ای که کاربر نگه داشته هم بستهٔ خودش را پیدا کند (سه نسخهٔ آخر می‌مانند)
          app=$(ls Tohid-Windows-App-*.7z)
          up "$app"
          files="$app Tohid-Windows-Setup.exe Tohid-Windows-Offline.exe Tohid-Windows.msi Tohid-Mac-AppleSilicon.dmg Tohid-Mac-Intel.dmg Tohid-Linux.deb"
          for f in $files; do [ "$f" = "$app" ] || up "$f"; done
          #  نام‌های رو به کاربر «MyShop-…» (برنامه «فروشگاه من» است)؛ «Tohid-…» فقط برای
          #  به‌روزرسانیِ درون‌برنامهٔ نسخه‌های نصب‌شده می‌ماند
          for f in Windows-Setup.exe Windows-Offline.exe Mac-AppleSilicon.dmg Mac-Intel.dmg Linux.deb; do
            cp "Tohid-$f" "MyShop-$f"; up "MyShop-$f"
          done
          files="$files MyShop-Windows-Setup.exe MyShop-Windows-Offline.exe MyShop-Mac-AppleSilicon.dmg MyShop-Mac-Intel.dmg MyShop-Linux.deb"
          gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name' \
            | grep '^Tohid-Windows-App-.*\.7z$' | sort -V | head -n -3 \
            | while read -r old; do gh release delete-asset "$TAG" "$old" -y -R "${{ github.repository }}" || true; done
          #  نصابِ همهٔ کامپیوترها در یک بسته — انتخابِ سیستم داخلِ خودِ بسته
          #  (‎desktop/setup-all‎: راهنما و سه نصب‌کنندهٔ کوچک که مک تراشه را خودش تشخیص می‌دهد)
          B="$RUNNER_TEMP/MyShop-Setup"
          mkdir -p "$B/Windows" "$B/Mac-Apple-Silicon" "$B/Mac-Intel" "$B/Linux"
          #  نصابِ آنلاین + بستهٔ کنارش: بی‌اینترنت از بسته نصب می‌کند و اگر بسته خراب باشد خودش دانلود می‌کند
          cp MyShop-Windows-Setup.exe "$app" "$B/Windows/"
          cp MyShop-Mac-AppleSilicon.dmg "$B/Mac-Apple-Silicon/"
          cp MyShop-Mac-Intel.dmg "$B/Mac-Intel/"
          cp MyShop-Linux.deb "$B/Linux/"
          cp "$GITHUB_WORKSPACE/desktop/setup-all/"* "$B/"
          chmod +x "$B/Install-Mac.command" "$B/Install-Linux.sh"
          (cd "$RUNNER_TEMP" && zip -r -0 -q MyShop-Setup-All.zip MyShop-Setup)
          mv "$RUNNER_TEMP/MyShop-Setup-All.zip" .
          up MyShop-Setup-All.zip
          sha256sum $files > SHA256SUMS.txt
          up SHA256SUMS.txt
          #  امضای جدای فهرست — شرح سرِ `update/ReleaseSignature.kt`
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/update.pem" SHA256SUMS.txt | base64 -w0 > SHA256SUMS.txt.sig
            rm -f "$RUNNER_TEMP/update.pem"
            up SHA256SUMS.txt.sig
          elif [ -n "$TOHID_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::کلیدِ عمومیِ به‌روزرسانی سنجاق شده ولی secretِ TOHID_UPDATE_SIGNING_KEY نیست"
            exit 1
          fi
          up version.txt
