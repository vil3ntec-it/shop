name: آزمونِ ۳۰ روز بی اینترنت (SYN-01)

# SYN-01 (§۶.۱۲): `Offline30DaysDesktopTest` › «دکانِ شلوغ با دو دستگاه ۳۰ روز بی اینترنت ⇒ همه یک بار به سرور و یکسان»
# با موتورهای واقعیِ کامپیوتر و سرورِ واقعی (`server/test/e2e/lib/offline30-backend.mjs`، PGlite ِ در حافظه، ساعت و شبکهٔ
# دست‌گردان). دروازه‌اش `OfflineBackend.available` (`desktop/src/test/kotlin/.../offline/OfflineShop.kt`) فقط ریشهٔ مخزن،
# `server/node_modules` و `node` می‌خواهد؛ کارِ «کامپایل و آزمون» ِ `tohid-desktop.yml` `npm ci` ِ سرور ندارد ⇒ آن‌جا
# `KTEST SKIP`. ⛔ آن ورک‌فلو انتشار است و دست نمی‌خورد؛ این یکی فقط آزمون است — هیچ ساخت، artifact ِ منتشرشدنی یا
# مجوزِ نوشتنی ندارد — و فقط همین کلاس را می‌دواند (PGlite ِ محلی ≈ ۵٫۵ دقیقه؛ کامپایلِ کامپیوتر ≈ ۴٫۵ دقیقه).
#
# ⛔ صفِ Actions (#329): PR فقط وقتی موتورهای همگام‌سازی و دفتر (اندروید/core)، سرورِ همگام‌سازی، خودِ آزمون یا همین
# ورک‌فلو عوض شود؛ وگرنه هفته‌ای یک بار روی main، و هر وقت لازم شد Actions ⇒ «آزمونِ ۳۰ روز…» ⇒ Run workflow.
on:
  pull_request:
    paths:
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/sync/**'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/data/**'
      - 'core/src/commonMain/kotlin/ir/vil3ntec/tohid/core/sync/**'
      - 'desktop/src/test/kotlin/ir/vil3ntec/tohid/desktop/offline/**'
      - 'server/test/e2e/lib/offline30-backend.mjs'
      - 'server/src/lib/sync*.js'
      - 'server/src/routes/sync*.js'
      - '.github/workflows/offline30.yml'
  schedule:
    #  چهارشنبه‌ها ۰۳:۴۳ UTC (جدا از دوشنبهٔ `perf.yml`)
    - cron: '43 3 * * 3'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای زمان‌بندی‌شده و دستی وسطِ کار لغو نمی‌شود.
  group: offline30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline30:
    name: ۳۰ روز بی اینترنت — کامپیوتر + سرورِ واقعی
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      #  ⛔ §۱۴: فقط از قفل (`package-lock.json`)، بی `|| npm install` — همان دروازهٔ `OfflineBackend.available`
      - name: وابستگی‌های سرور
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: آزمونِ ۳۰ روزه
        run: ./desktop/gradlew --no-daemon -p desktop test --tests '*Offline30DaysDesktopTest*'

      #  «سبز» با SKIP شاهد نیست: هر دو آزمونِ کلاس اجرا شده‌اند، هیچ‌کدام کنار نرفته (دروازه دوباره بسته نشده)
      - name: بی SKIP
        run: |
          f=desktop/build/test-results/test/TEST-ir.vil3ntec.tohid.desktop.offline.Offline30DaysDesktopTest.xml
          [ -f "$f" ] || { echo "::error::گزارشِ آزمون نیست: $f"; exit 1; }
          head=$(grep -o '<testsuite [^>]*>' "$f" | head -1)
          tests=$(echo "$head" | sed -n 's/.* tests="\([0-9]*\)".*/\1/p')
          skipped=$(echo "$head" | sed -n 's/.* skipped="\([0-9]*\)".*/\1/p')
          echo "tests=$tests skipped=$skipped"
          [ "${tests:-0}" -ge 2 ] || { echo "::error::کمتر از دو آزمون اجرا شد ($tests)"; exit 1; }
          [ "${skipped:-1}" = 0 ] || { echo "::error::$skipped آزمون SKIP شد — دروازهٔ OfflineBackend.available بسته است"; exit 1; }
          {
            echo "### SYN-01 — ۳۰ روز بی اینترنت"
            echo '```'
            echo "$head"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline30-report
          path: |
            desktop/build/test-results/test/TEST-ir.vil3ntec.tohid.desktop.offline.Offline30DaysDesktopTest.xml
            desktop/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14
