name: مشخصاتِ جامع

# docs/spec تکه‌های MASTER-SPEC.md است. اگر کسی تکه‌ای را دستی ویرایش کند، یا STATUS.md
# شناسه‌ای را جا بیندازد یا ✅ بی‌شواهد بزند، این‌جا قرمز می‌شود.

on:
  push:
    branches: ['claude/**', main]
    paths:
      - 'docs/spec/**'
      - '.github/workflows/spec.yml'
  pull_request:
    paths:
      - 'docs/spec/**'
      - '.github/workflows/spec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: سنجشِ docs/spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/spec/tools/spec.mjs check
