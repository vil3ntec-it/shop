name: مشخصاتِ جامع

# docs/spec تکه‌های MASTER-SPEC.md (مشخصاتِ نسخهٔ ۳) است. اگر چسباندنِ تکه‌ها همان SHA-256ِ اصل نباشد،
# تکه‌ای دستی ویرایش شود، شناسه‌ای تکراری یا ارجاعی شکسته باشد، STATUS.md یا BLOCKERS.md با سند نخواند،
# یا IMPLEMENTED-VERIFIED بی دستور/نتیجهٔ آزمون و commit/PR باشد، این‌جا قرمز می‌شود.

on:
  push:
    branches: ['claude/**', main]
    paths:
      - 'docs/spec/**'
      - '.github/workflows/spec.yml'
  pull_request:
    paths:
      - 'docs/spec/**'
      - '.github/workflows/spec.yml'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای main هرگز وسطِ کار لغو نمی‌شود.
  group: spec-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: سنجشِ docs/spec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/spec/tools/spec.mjs check
      - run: node --test docs/spec/tools/spec.test.mjs
