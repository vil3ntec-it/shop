name: ابزارِ مهاجرتِ داده (shop-migrate)

# فقط ساخت و آزمونِ `tools/shop-migrate` — به هیچ برنامه‌ای وصل نیست و چیزی منتشر نمی‌کند.
# روی تغییرِ همان فایل‌های برنامه هم اجرا می‌شود که ابزار از آن‌ها کپی می‌گیرد — دقیقاً
# `legacyFiles` و `coreFiles`ِ tools/shop-migrate/build.gradle.kts (فایلی که آن‌جا اضافه شد این‌جا هم).
# ⛔ ShopStore.kt و ReportEngine.kt دیگر این‌جا نیستند: ابزار آن‌ها را کامپایل نمی‌کند و فقط فرمولشان را
# در LegacyFigures.kt تکرار می‌کند، پس نتیجهٔ این ورک‌فلو با تغییرِ آن‌ها عوض نمی‌شد (هر PRِ دفتر آن را
# بیهوده می‌دواند). نگهبانِ هم‌خوانیِ فرمول‌ها `MigrationGoldenTest` است که در «توحید بومی» و
# «فروشگاه من — کامپیوتر» روی همان تغییر می‌دود.

on:
  pull_request:
    paths:
      - 'tools/shop-migrate/**'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/data/Models.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/Jalali.kt'
      - 'core/src/commonMain/kotlin/ir/vil3ntec/tohid/core/calendar/ShopDay.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/Format.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/LocaleText.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/calendar/SolarHijri.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/calendar/CivilDays.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/text/LocaleFormat.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/text/TextNormalizer.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/sync/v1/Ulid.kt'
      #  ابزار با Gradleِ پروژهٔ کامپیوتر ساخته می‌شود (پایین)
      - 'desktop/gradle/wrapper/**'
      - '.github/workflows/shop-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'tools/shop-migrate/**'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/data/Models.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/Jalali.kt'
      - 'core/src/commonMain/kotlin/ir/vil3ntec/tohid/core/calendar/ShopDay.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/Format.kt'
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/LocaleText.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/calendar/SolarHijri.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/calendar/CivilDays.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/text/LocaleFormat.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/core/text/TextNormalizer.kt'
      - 'core/src/jvmMain/kotlin/ir/vil3ntec/tohid/sync/v1/Ulid.kt'
      - 'desktop/gradle/wrapper/**'
      - '.github/workflows/shop-migrate.yml'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای main هرگز وسطِ کار لغو نمی‌شود.
  group: shop-migrate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # همان Gradleِ پروژهٔ کامپیوتر (wrapperِ desktop) — همان راهی که صاحبِ محصول اجرا می‌کند
      - name: طرحِ SQLite و آزمون‌ها
        run: ./desktop/gradlew --no-daemon -p tools/shop-migrate test

      - name: اجرای آزمایشی روی دفترِ ساختگی
        run: |
          ./desktop/gradlew --no-daemon -q -p tools/shop-migrate installDist
          bin=tools/shop-migrate/build/install/shop-migrate/bin/shop-migrate
          "$bin" fixture --seed 42 --size medium --anomalies --out "$RUNNER_TEMP/fixture.json"
          "$bin" dry-run "$RUNNER_TEMP/fixture.json" | tee "$RUNNER_TEMP/report.txt"
