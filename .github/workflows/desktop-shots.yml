name: عکس‌های برنامهٔ کامپیوتر

#  برنامهٔ واقعیِ کامپیوتر روی نمایشگرِ مجازی (Xvfb) با یک دفترِ نمایشی باز
#  می‌شود و از همهٔ بخش‌هایش عکس گرفته می‌شود (`DevShot`). عکس‌ها در شاخهٔ
#  جدای `desktop-screenshots` می‌نشینند — نه در main و نه در شاخهٔ کار — تا
#  هر کس بی ساختن ببیند برنامه واقعاً چه شکلی است.
on:
  pull_request:
    paths:
      - 'desktop/**'
      #  نصاب و بستهٔ «همهٔ کامپیوترها» در هیچ عکسی دیده نمی‌شوند
      - '!desktop/installer/**'
      - '!desktop/setup-all/**'
      #  کامپیوتر از اندروید فقط کدِ Kotlin و سه پوشهٔ res (قلم، صدا، نشان) را برمی‌دارد
      #  (`androidSources` و `copyRes` در desktop/build.gradle.kts)؛ مانیفست و بقیهٔ res فقط اندرویدند
      - 'android-native/app/src/main/java/**'
      - 'android-native/app/src/main/res/font/**'
      - 'android-native/app/src/main/res/raw/**'
      - 'android-native/app/src/main/res/drawable-xxxhdpi/**'
      - '.github/workflows/desktop-shots.yml'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند؛ اجرای دستی لغو نمی‌شود
  group: desktop-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  #  فهرستِ فایل‌های PR برای گزینشِ گروه‌های نسخهٔ ۳ (`plan`)
  pull-requests: read

jobs:
  #  کدام گروه‌های نسخهٔ ۳ عکس بگیرند و در چند تکهٔ موازی:
  #   • شاخهٔ یک گروه (`…-v3-<گروه>`) ⇐ foundation + همان گروه + هر گروهِ دیگری که در `ui/v3/<گروه>/` یا
  #     `shots/<Group>Shots.kt` ِ همان درخواست تغییر کرده؛
  #   • پایه (v3-foundation)، phone-v3، هر شاخهٔ دیگر و اجرای دستی ⇐ همهٔ گروه‌ها، سه‌تا‌سه‌تا در تکه‌های موازی.
  #  فهرستِ گروه‌ها از خودِ `*Shots.kt` خوانده می‌شود (`override val group`)؛ گروهِ تازه خودش می‌آید.
  plan:
    name: گزینشِ گروه‌های نسخهٔ ۳
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          BR="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ALL=$(grep -ho 'override val group = "[a-z0-9-]*"' desktop/src/main/kotlin/ir/vil3ntec/tohid/desktop/shots/*Shots.kt | sed 's/.*"\(.*\)"/\1/' | sort -u)
          test -n "$ALL"
          #  گروهِ شاخه از نامش (`…-v3-<گروه>`) و فقط اگر چنین گروهی در `*Shots.kt` هست
          G="${BR##*-v3-}"
          FULL=1
          if [ "$EVENT" = pull_request ] && [ "$G" != "$BR" ] && [ "$G" != foundation ] && grep -Fxq "$G" <<<"$ALL"; then FULL=0; fi
          if [ "$FULL" = 1 ]; then
            PICK="$ALL"
          else
            FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            PICK=$( { echo foundation; echo "$G"
              sed -nE 's#^android-native/app/src/main/java/ir/vil3ntec/tohid/ui/v3/([a-z0-9-]+)/.*#\1#p' <<<"$FILES"
              for f in $(sed -nE 's#^desktop/src/main/kotlin/ir/vil3ntec/tohid/desktop/shots/([A-Za-z]+Shots)\.kt$#\1#p' <<<"$FILES"); do
                grep -ho 'override val group = "[a-z0-9-]*"' "desktop/src/main/kotlin/ir/vil3ntec/tohid/desktop/shots/$f.kt" 2>/dev/null | sed 's/.*"\(.*\)"/\1/' || true
              done; } | sort -u | grep -Fxf <(echo "$ALL") )
          fi
          #  تکه‌ها: هر تکه تا سه گروه (`groupshots:a,b,c`)
          SHARDS=$(printf '%s\n' $PICK | paste -sd' ' | python3 -c 'import json,sys; g=sys.stdin.read().split(); print(json.dumps([",".join(g[i:i+3]) for i in range(0, len(g), 3)]))')
          echo "گروه‌ها ($([ "$FULL" = 1 ] && echo همه || echo "گروهِ $G و تغییرکرده‌ها")): $SHARDS"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  shots:
    name: عکس از همهٔ بخش‌ها
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: قلم و نمایشگرِ مجازی
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-noto-core >/dev/null

      #  ‎-Pdev=true‎ بی نشانیِ سرور ⇐ برنامه «بی سرور» است و قفلِ اشتراک نمی‌گیرد،
      #  پس صفحه‌های پولی (قرض‌داران، …) هم در عکس‌ها دیده می‌شوند. نسخهٔ دستِ
      #  کاربر هرگز ‎dev‎ ساخته نمی‌شود.
      - name: کامپایل
        working-directory: desktop
        run: ./gradlew --no-daemon -q -Pdev=true compileKotlin

      - name: دفترِ نمایشی
        run: node desktop/tools/demo-ledger.mjs "$RUNNER_TEMP/tohid-data"

      - name: اجرای برنامه و عکس
        working-directory: desktop
        env:
          TOHID_DATA_DIR: ${{ runner.temp }}/tohid-data
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          #  ساختِ دو صفحهٔ خوش‌آمد را خودش رد می‌کند (پنجره در گوشهٔ ۰،۰ است).
          #  نمایشگر ۱۹۲۰×۱۰۸۰ است و پنجره با size: اندازه می‌گیرد؛ عکس فقط خودِ پنجره است.
          S="size:1280,800;wait:6000;shot:00-start;key:ESCAPE;wait:1500;shot:01-dashboard"
          S="$S;go:admin;wait:2000;shot:01b-admin-center;move:700,500;scroll:8;wait:600;shot:01c-admin-center-lower"
          S="$S;go:sale;wait:1500;shot:02-sale"
          #  صندوقِ سه‌ستونه با سه قلم (اسکن، «3*» و نام + Enter) و نمای جدولیِ کالا
          S="$S;type:626001007;key:ENTER;type:3*626001003;key:ENTER;type:صابون;key:ENTER;wait:1500;shot:02b-sale-cart"
          S="$S;posview:table;wait:1200;shot:02c-sale-table;posview:card;wait:800"
          S="$S;go:quick;wait:1500;shot:03-quick-sale"
          S="$S;go:debtors;wait:1500;shot:04-debtors"
          S="$S;cust:first;wait:1200;shot:04b-customer-ledger;custtab:1;wait:1000;shot:04c-customer-invoices;custtab:2;wait:1000;shot:04d-customer-items;custtab:0;cust:close"
          S="$S;go:warehouse;wait:1500;shot:05-warehouse"
          S="$S;go:products;wait:1500;shot:06-products-table"
          S="$S;prodsel:3;wait:800;shot:06b-products-bulk-bar;prodview:card;wait:1200;shot:06c-products-cards;prodsel:0;prodview:table;wait:800"
          S="$S;go:sales;wait:1500;shot:07-sales-history-cash-shift"
          S="$S;ret:first;wait:1500;shot:07b-return-form;ret:none;wait:1500;shot:07c-return-no-receipt;ret:close;wait:800"
          S="$S;go:purchasing;wait:1500;shot:08-purchasing;new:;wait:1200;shot:08b-purchase-invoice-new;key:ESCAPE;wait:800"
          S="$S;go:reports;wait:1500;shot:09-reports"
          S="$S;move:700,500;scroll:8;shot:10-reports-lower"
          S="$S;go:expenses;wait:1500;shot:11-expenses"
          S="$S;go:more;wait:1500;shot:12-more"
          S="$S;go:settings;wait:1500;shot:13-settings"
          #  دستگاه‌ها (HW): صفحه، پیش‌نمایشِ بی چاپگرِ برگهٔ آزمون، برچسب و برگهٔ A4، و نمایشگرِ مشتری با یک سبد
          S="$S;go:devices;wait:1500;shot:14-devices;hwshot:receipt;wait:1500;shot:14b-print-preview-receipt;hwshot:close"
          S="$S;hwshot:label;wait:1200;shot:14c-print-preview-label;hwshot:close;hwshot:a4;wait:1500;shot:14d-print-preview-a4;hwshot:close"
          S="$S;hwshot:customer;go:sale;wait:1500;type:626001007;key:ENTER;wait:1500;shot:14e-customer-display;hwshot:nocustomer"
          S="$S;go:audit;wait:1500;shot:14-audit-log"
          S="$S;go:team;wait:1500;shot:15-team"
          S="$S;go:devices;wait:1500;shot:15b-devices"
          S="$S;go:vip;wait:1500;shot:15c-subscription-offline-code"
          #  تخفیف‌ها (PRM): پنج قاعدهٔ نمونه (`PromoLive.demo`)، سبدِ همان ۰۲b با ردیف‌های تخفیف و کادرِ کد، صفحهٔ مدیر و ویرایشگر
          S="$S;promo:demo;go:sale;wait:1500;shot:20-sale-promos;go:promos;wait:1500;shot:21-promos-table;new:;wait:1200;shot:22-promo-editor;key:ESCAPE;wait:800"
          S="$S;go:dashboard;key:F11;wait:2000;shot:16-fullscreen-dashboard"
          S="$S;help:on;wait:1500;shot:17-shortcuts-F1;help:off"
          S="$S;key:F11;wait:1500;theme:DARK;go:products;wait:1500;shot:18-products-dark;prodsel:2;wait:800;shot:18b-products-dark-bulk;prodsel:0;go:dashboard;wait:1500;shot:19-dashboard-dark;theme:LIGHT"
          #  گوشی (phone-ui): پنجرهٔ ۳۹۰×۸۴۴ِ `PhonePreview` — عکس فقط از همان پنجره
          S="$S;phone:nav;wait:1500;pshot:20-phone-nav;phone:nav-dark;wait:1500;pshot:20b-phone-nav-dark;phone:settings;wait:1500;pshot:21-phone-settings;phone:settings-dark;wait:1500;pshot:21b-phone-settings-dark;phone:profile;wait:1500;pshot:22-phone-profile;phone:profile-dark;wait:1500;pshot:22b-phone-profile-dark;phone:cart;wait:2000;pshot:23-phone-cart-bar;phone:cart-open;wait:2000;pshot:23b-phone-cart-sheet;phone:cart-open-dark;wait:2000;pshot:23c-phone-cart-sheet-dark;phone:off"
          #  گوشی نسخهٔ ۳: «حساب من» (r4، واردشده و مهمان)، «تنظیمات» (r5: بالا، پایین، صفحهٔ یک بخش) و «بیشتر» (بالا و تهِ «تنظیمات») — روشن و تیره
          S="$S;phone:v3-profile;wait:1800;pshot:phone-v3-profile-in;phone:v3-profile-dark;wait:1500;pshot:phone-v3-profile-in-dark;phone:v3-profile-out;wait:1800;pshot:phone-v3-profile-out;phone:v3-profile-out-dark;wait:1500;pshot:phone-v3-profile-out-dark"
          S="$S;phone:v3-settings;wait:1800;pshot:phone-v3-settings-top;phone:v3-settings-dark;wait:1500;pshot:phone-v3-settings-top-dark;phone:v3-settings-scrolled;wait:1800;pshot:phone-v3-settings-scrolled;phone:v3-settings-scrolled-dark;wait:1500;pshot:phone-v3-settings-scrolled-dark;phone:v3-settings-detail;wait:1800;pshot:phone-v3-settings-detail;phone:v3-settings-detail-dark;wait:1500;pshot:phone-v3-settings-detail-dark"
          S="$S;phone:v3-more;wait:1800;pshot:phone-v3-more-top;phone:v3-more-dark;wait:1500;pshot:phone-v3-more-top-dark;phone:v3-more-bottom;wait:2000;pshot:phone-v3-more-bottom;phone:v3-more-bottom-dark;wait:1500;pshot:phone-v3-more-bottom-dark;phone:off"
          #  phone-v3-home: خانهٔ r7، کارتِ کششیِ r6، آمارِ r8، نوارِ r10 (هر موردِ فعال + تمدید)، ویرایشگرِ نوار، نوارِ سفارشی، جست‌وجو
          H="phone:v3home;wait:1500;pshot:phone-v3-home-01-home;phone:v3home-dark;wait:1500;pshot:phone-v3-home-01b-home-dark"
          H="$H;phone:v3home-pull;wait:1800;pshot:phone-v3-home-02-pull;phone:v3home-pull-dark;wait:1800;pshot:phone-v3-home-02b-pull-dark"
          H="$H;phone:v3home-stats;wait:1800;pshot:phone-v3-home-03-stats;phone:v3home-stats-dark;wait:1800;pshot:phone-v3-home-03b-stats-dark"
          H="$H;phone:v3home-navs;wait:1500;pshot:phone-v3-home-04-nav-states;phone:v3home-navs-dark;wait:1500;pshot:phone-v3-home-04b-nav-states-dark"
          H="$H;phone:v3home-renew;wait:1500;pshot:phone-v3-home-05-renew-pill"
          H="$H;phone:v3home-big;wait:1500;pshot:phone-v3-home-06-big-long-name;phone:v3home-big-pull;wait:1800;pshot:phone-v3-home-06b-big-pull;phone:v3home-big-stats;wait:1800;pshot:phone-v3-home-06c-big-stats"
          H="$H;phone:v3home-editor;wait:1500;pshot:phone-v3-home-07-nav-editor;phone:v3home-editor-dark;wait:1500;pshot:phone-v3-home-07b-nav-editor-dark"
          H="$H;phone:v3home-custom;wait:1500;pshot:phone-v3-home-08-custom-nav;phone:v3home-search;wait:1500;pshot:phone-v3-home-09-search;phone:off"
          S="$S;$H"
          #  گوشی نسخهٔ ۳، صندوق (r3 بسته / r2 باز) — `PhoneV3CartPreview`
          S="$S;phone:v3cart-grid;wait:2500;pshot:phone-v3-cart-grid;phone:v3cart-grid-dark;wait:2500;pshot:phone-v3-cart-grid-dark"
          S="$S;phone:v3cart-list;wait:2500;pshot:phone-v3-cart-list;phone:v3cart-list-dark;wait:2500;pshot:phone-v3-cart-list-dark"
          S="$S;phone:v3cart-search;wait:2800;pshot:phone-v3-cart-search;phone:v3cart-search-dark;wait:2500;pshot:phone-v3-cart-search-dark"
          S="$S;phone:v3cart-keypad;wait:3000;pshot:phone-v3-cart-keypad;phone:v3cart-keypad-dark;wait:2500;pshot:phone-v3-cart-keypad-dark"
          S="$S;phone:v3cart-open;wait:3000;pshot:phone-v3-cart-open;phone:v3cart-open-dark;wait:2500;pshot:phone-v3-cart-open-dark"
          S="$S;phone:v3cart-long;wait:2500;pshot:phone-v3-cart-long;phone:v3cart-long-open;wait:3000;pshot:phone-v3-cart-long-open;phone:v3cart-long-open-dark;wait:2500;pshot:phone-v3-cart-long-open-dark"
          S="$S;phone:v3cart-empty;wait:2200;pshot:phone-v3-cart-empty;phone:v3cart-scan;wait:2500;pshot:phone-v3-cart-scan;phone:v3cart-scan-dark;wait:2200;pshot:phone-v3-cart-scan-dark;phone:off"
          #  قرض‌دارانِ گوشی (phone v3، r9): سه نفرِ r9، هشت نفرِ بلند، خالی — روز و شب
          #  «many-end»: همان فهرست تا ته پایین‌کشیده — آخرین ردیف از زیرِ دکمهٔ «+» بیرون است
          S="$S;phone:debtors-r9;wait:2500;pshot:phone-v3-debtors-r9;phone:debtors-r9-dark;wait:2500;pshot:phone-v3-debtors-r9-dark;phone:debtors-many-dark;wait:2500;pshot:phone-v3-debtors-many-dark;phone:debtors-many;wait:2500;pshot:phone-v3-debtors-many;move:200,600;scroll:15;wait:1200;pshot:phone-v3-debtors-many-end;phone:debtors-empty;wait:2000;pshot:phone-v3-debtors-empty;phone:debtors-empty-dark;wait:2000;pshot:phone-v3-debtors-empty-dark;phone:off"
          #  حالتِ پیک (phone-v3-courier-*): خانه، مسیر، پیگیری، ارسال، نقدِ من، آمار — روشن و تیره؛ حساب، ورود، تأییدِ نقد — روشن؛ دادهٔ نمایشی
          S="$S;phone:courier-home;wait:1200;pshot:phone-v3-courier-home;phone:courier-home-dark;wait:1200;pshot:phone-v3-courier-home-dark;phone:courier-route;wait:1200;pshot:phone-v3-courier-route;phone:courier-route-dark;wait:1200;pshot:phone-v3-courier-route-dark;phone:courier-track;wait:1200;pshot:phone-v3-courier-track;phone:courier-track-dark;wait:1200;pshot:phone-v3-courier-track-dark;phone:courier-ship;wait:1200;pshot:phone-v3-courier-ship;phone:courier-ship-dark;wait:1200;pshot:phone-v3-courier-ship-dark;phone:courier-cash;wait:1200;pshot:phone-v3-courier-cash;phone:courier-cash-dark;wait:1200;pshot:phone-v3-courier-cash-dark;phone:courier-stats;wait:1200;pshot:phone-v3-courier-stats;phone:courier-stats-dark;wait:1200;pshot:phone-v3-courier-stats-dark;phone:courier-account;wait:1200;pshot:phone-v3-courier-account;phone:courier-join;wait:1200;pshot:phone-v3-courier-join;phone:courier-cod;wait:1200;pshot:phone-v3-courier-cod;phone:off"
          #  حسابِ یک قرض‌دار (owner-feedback-2): کشوی بسته/باز، فهرستِ بلند، برگهٔ جزئیاتِ ردیف (روز و شب)، بی تراکنش، و برگهٔ «ثبتِ تراکنش» (آخر، چون برگه باز می‌ماند)
          S="$S;phone:debtor-detail;wait:3000;pshot:phone-v3-debtor-detail;phone:debtor-detail-dark;wait:2500;pshot:phone-v3-debtor-detail-dark;phone:debtor-detail-drawer;wait:3000;pshot:phone-v3-debtor-detail-drawer;phone:debtor-detail-drawer-dark;wait:2500;pshot:phone-v3-debtor-detail-drawer-dark;phone:debtor-detail-long;wait:3000;pshot:phone-v3-debtor-detail-long;phone:debtor-detail-long-dark;wait:2500;pshot:phone-v3-debtor-detail-long-dark;phone:debtor-detail-tx;wait:3500;pshot:phone-v3-debtor-detail-tx;phone:debtor-detail-tx-dark;wait:2500;pshot:phone-v3-debtor-detail-tx-dark;phone:debtor-detail-empty;wait:3000;pshot:phone-v3-debtor-detail-empty;phone:debtor-detail-composer;wait:3500;pshot:phone-v3-debtor-detail-composer;phone:debtor-detail-composer-dark;wait:2500;pshot:phone-v3-debtor-detail-composer-dark;phone:off"
          #  مجموعهٔ ثابتِ ظاهر (نسخهٔ ۲): صندوق روز و شب، کالاها، داشبورد و قرض‌داران در دو اندازهٔ واقعی
          for WH in 1280,800 1920,1080; do
            N="v2-${WH/,/x}"
            #  ماوس روی عنوانِ سربرگ (جای بی‌کلیک) — وگرنه کارت یا ردیفِ زیرِ ماوس رنگِ «هاور» می‌گیرد و
            #  در عکس شبیهِ کارتِ خاموش دیده می‌شود (بازبینیِ ۱۴۰۵/۰۷/۲۷)
            MX=$(( ${WH%,*} - 120 ))
            S="$S;size:$WH;wait:1500;move:$MX,30;theme:LIGHT;go:sale;wait:2000;shot:$N-pos-light;posview:table;wait:1200;shot:$N-pos-table-light;posview:card;wait:800"
            S="$S;theme:DARK;wait:2000;shot:$N-pos-dark;theme:LIGHT;wait:1200"
            S="$S;go:products;wait:1800;shot:$N-products;go:dashboard;wait:1800;shot:$N-dashboard;go:debtors;wait:1800;shot:$N-debtors"
          done
          #  سیستمِ رنگِ VILL3N: صفحه‌هایی که بالا فقط در روز گرفته می‌شوند، در شب هم؛ و سفارش‌ها در هر دو
          S="$S;size:1280,800;move:1160,30;theme:DARK;wait:1500;go:debtors;wait:1800;shot:vill3n-debtors-dark;go:settings;wait:1800;shot:vill3n-settings-dark"
          S="$S;go:orders;wait:1800;shot:vill3n-orders-dark;theme:LIGHT;wait:1500;go:orders;wait:1800;shot:vill3n-orders-light"
          export JAVA_TOOL_OPTIONS="-Dtohid.shot=$RUNNER_TEMP/shots -Dtohid.shot.every=9000 -Dtohid.shot.exit=true -Dtohid.shot.script=$S -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8"
          #  هر دو مجموعه (گوشی و نسخهٔ ۲/VILL3N): نمایشگرِ ۱۹۲۰×۱۰۸۰ برای پنجرهٔ بزرگ و مهلتِ بیشتر برای عکس‌های گوشی
          timeout 1080 xvfb-run -s "-screen 0 1920x1080x24" ./gradlew --no-daemon -q -Pdev=true run || true
          ls -la "$RUNNER_TEMP/shots"
          test -n "$(ls "$RUNNER_TEMP/shots")"

      - uses: actions/upload-artifact@v4
        with:
          name: shots-legacy
          path: ${{ runner.temp }}/shots
          retention-days: 3

  #  بازسازیِ VILL3N: کیت و هر گروه (`desktop/.../shots/<Group>Shots.kt`) — هر حالت روشن/تیره ×
  #  فارسی/انگلیسی در shots/v3/<گروه>/<حالت>-<تم>-<زبان>.png. هر تکه برنامهٔ خودش را باز می‌کند؛ پایانِ
  #  هر گروه نشانِ `.done` دارد (`DevShot`). مهلت تمام شد یا گروهی نیمه ماند ⇐ کار قرمز، نه عکسِ کم و بی‌صدا.
  v3:
    name: نسخهٔ ۳ — ${{ matrix.groups }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        groups: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: قلم و نمایشگرِ مجازی
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-noto-core >/dev/null

      - name: کامپایل
        working-directory: desktop
        run: ./gradlew --no-daemon -q -Pdev=true compileKotlin

      - name: دفترِ نمایشی
        run: node desktop/tools/demo-ledger.mjs "$RUNNER_TEMP/tohid-data"

      - name: عکس‌های گروه‌ها
        working-directory: desktop
        env:
          TOHID_DATA_DIR: ${{ runner.temp }}/tohid-data
          SHOT_GROUPS: ${{ matrix.groups }}
        run: |
          mkdir -p "$RUNNER_TEMP/shots/v3"
          S="wait:6000;key:ESCAPE;wait:1500;groupshots:$SHOT_GROUPS"
          export JAVA_TOOL_OPTIONS="-Dtohid.shot=$RUNNER_TEMP/shots/v3 -Dtohid.shot.every=9000 -Dtohid.shot.exit=true -Dtohid.shot.script=$S -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8"
          set +e
          timeout 1800 xvfb-run -s "-screen 0 1440x900x24" ./gradlew --no-daemon -q -Pdev=true run
          rc=$?
          set -e
          [ "$rc" -eq 124 ] && echo "::error::مهلتِ ۳۰ دقیقهٔ عکس‌های «$SHOT_GROUPS» تمام شد"
          bad=""
          for g in ${SHOT_GROUPS//,/ }; do
            n=$(find "$RUNNER_TEMP/shots/v3/$g" -name '*.png' 2>/dev/null | wc -l)
            if [ -f "$RUNNER_TEMP/shots/v3/$g/.done" ]; then echo "$g: $n عکس، کامل"
            else bad="$bad $g($n$(cat "$RUNNER_TEMP/shots/v3/$g/.partial" 2>/dev/null | sed 's/^/ از /'))"; fi
          done
          if [ -n "$bad" ]; then echo "::error::عکسِ این گروه‌ها کامل نشد:$bad (کدِ خروج $rc)"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-v3-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
          retention-days: 3
          if-no-files-found: ignore

  #  همهٔ عکس‌ها یک‌جا ⇐ شاخهٔ desktop-screenshots. اگر تکه‌ای قرمز شد، باز هم هرچه هست منتشر می‌شود
  #  (و کارِ همان تکه قرمز می‌ماند)، تا عکس‌های گروه‌های سالم از دست نروند.
  publish:
    name: انتشارِ عکس‌ها
    needs: [shots, v3]
    if: ${{ always() && needs.shots.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          merge-multiple: true
          path: ${{ runner.temp }}/shots

      - name: نشان‌های پایانِ گروه بیرون
        run: find "$RUNNER_TEMP/shots" \( -name .done -o -name .partial \) -delete

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14

      #  شاخهٔ جدای desktop-screenshots:
      #   • ریشه = عکس‌ها و README ِ آخرین اجرا، مثلِ پیش (خطِ ۳ِ README شاخهٔ منبع را می‌گوید)؛
      #   • pr/<شاخه>/ = عکس‌ها و README ِ هر شاخهٔ کار. هر اجرا فقط پوشهٔ خودش و مجموعهٔ ریشه را عوض
      #     می‌کند و بقیه را از سرِ همان لحظهٔ شاخه نگه می‌دارد؛ پوشه‌ای که ۲۱ روز اجرا نداشته برداشته می‌شود.
      #  ⛔ پیش‌تر `git init` + `push -f`: هر اجرا پوشهٔ همهٔ شاخه‌های دیگر را پاک می‌کرد و دو اجرای
      #  هم‌زمان «cannot lock ref … expected …» می‌گرفتند. حالا هر تلاش از سرِ تازهٔ شاخه ساخته می‌شود و
      #  فقط با `--force-with-lease=<همان سر>` می‌رود: مقایسه‌وجابه‌جاییِ اتمی؛ اگر اجرای دیگری در این
      #  فاصله فرستاده باشد رد می‌شود و از سرِ تازه دوباره، تا ۶ بار با فاصلهٔ فزاینده. هیچ pushِ کورِ -f
      #  نمانده. تاریخچه عمداً یک commit می‌ماند: pushِ عادی (fast-forward) چند مگابایت عکسِ **هر**
      #  اجرا را برای همیشه در مخزن نگه می‌داشت و هر cloneِ کامل سنگین می‌شد.
      - name: انتشار در شاخهٔ desktop-screenshots
        env:
          URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          shopt -s nullglob
          REF=refs/heads/desktop-screenshots
          BR="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SAFE=$(printf '%s' "$BR" | tr -c 'A-Za-z0-9._-' '-')
          SHOTS="$RUNNER_TEMP/shots"
          PUB="$RUNNER_TEMP/pub"
          #  اندازه‌های واقعیِ عکس‌ها از سرآیندِ PNG — درست، هر اندازهٔ نمایشگر یا پنجره‌ای که اجرا داشته باشد
          DIMS=$(python3 -c 'import struct,sys; print("، ".join("%d×%d" % s for s in sorted({struct.unpack(">II", open(f, "rb").read(24)[16:24]) for f in sys.argv[1:]})))' "$SHOTS"/*.png)
          readme() {  # $1 = پوشه، $2 = عنوان
            {
              echo "# $2"
              echo
              echo "از \`${GITHUB_SHA::7}\` (${BR}) — دفترِ نمایشی روی نمایشگرِ مجازی؛ اندازهٔ عکس‌ها: ${DIMS}."
              echo
              for f in "$1"/*.png; do b=$(basename "$f" .png); echo "## $b"; echo; echo "![$b]($b.png)"; echo; done
            } > "$1/README.md"
          }
          for i in 1 2 3 4 5 6; do
            cd "$RUNNER_TEMP" && rm -rf "$PUB"
            #  سرِ کنونیِ شاخه؛ «نیست» (کدِ ۲) با خطای شبکه یکی گرفته نمی‌شود
            if git ls-remote --exit-code "$URL" "$REF" >/dev/null; then
              git clone -q --depth 1 --branch desktop-screenshots "$URL" "$PUB" || { sleep $(( (1 << i) + RANDOM % 5 )); continue; }
              LEASE="$REF:$(git -C "$PUB" rev-parse HEAD)"
            elif [ $? -eq 2 ]; then
              git init -q -b desktop-screenshots "$PUB"
              LEASE="$REF:"   # خالی = شاخه نباید باشد
            else
              sleep $(( (1 << i) + RANDOM % 5 )); continue
            fi
            cd "$PUB"
            find . -maxdepth 1 -name '*.png' -delete
            cp "$SHOTS"/*.png .
            rm -rf "pr/$SAFE" && mkdir -p "pr/$SAFE" && cp "$SHOTS"/*.png "pr/$SAFE/"
            date +%s > "pr/$SAFE/.stamp"
            readme "pr/$SAFE" "عکس‌های شاخهٔ $BR"
            #  کیت و گروه‌های نسخهٔ ۳ (`groupshots`): pr/<شاخه>/v3/<گروه>/<حالت>-<تم>-<زبان>.png
            if [ -d "$SHOTS/v3" ]; then
              cp -r "$SHOTS/v3" "pr/$SAFE/" 2>/dev/null || true
              for g in "pr/$SAFE"/v3/*/; do
                if ls "$g"*.png >/dev/null 2>&1; then readme "${g%/}" "نسخهٔ ۳ — $(basename "$g")"; fi
              done
              { echo "---"; echo; echo "## نسخهٔ ۳ (هر گروه)"; echo
                for g in "pr/$SAFE"/v3/*/; do n=$(basename "$g"); echo "- [$n](v3/$n/README.md)"; done; } >> "pr/$SAFE/README.md"
            fi
            NOW=$(date +%s)
            for d in pr/*/; do
              s=$(cat "$d.stamp" 2>/dev/null || true); [[ "$s" =~ ^[0-9]+$ ]] || s=0
              [ $((NOW - s)) -le 1814400 ] || rm -rf "$d"
            done
            readme . "عکس‌های برنامهٔ کامپیوتر"
            { echo "---"; echo; echo "## پوشهٔ هر شاخه"; echo
              for d in pr/*/; do n=${d#pr/}; echo "- [${n%/}](${d}README.md)"; done; } >> README.md
            git checkout -q --orphan publish
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "عکس‌های برنامهٔ کامپیوتر از ${GITHUB_SHA::7} (${BR})"
            if git push -q --force-with-lease="$LEASE" "$URL" "HEAD:$REF"; then
              echo "منتشر شد (تلاشِ $i): https://github.com/${GITHUB_REPOSITORY}/tree/desktop-screenshots/pr/$SAFE"
              exit 0
            fi
            echo "::warning::سرِ desktop-screenshots در این فاصله عوض شد یا فرستادن نشد (تلاشِ $i) — از سرِ تازه دوباره"
            sleep $(( (1 << i) + RANDOM % 5 ))
          done
          echo "::error::انتشارِ عکس‌ها پس از ۶ تلاش نشد"; exit 1
