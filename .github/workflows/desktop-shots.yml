name: عکس‌های برنامهٔ کامپیوتر

#  برنامهٔ واقعیِ کامپیوتر روی نمایشگرِ مجازی (Xvfb) با یک دفترِ نمایشی باز
#  می‌شود و از همهٔ بخش‌هایش عکس گرفته می‌شود (`DevShot`). عکس‌ها در شاخهٔ
#  جدای `desktop-screenshots` می‌نشینند — نه در main و نه در شاخهٔ کار — تا
#  هر کس بی ساختن ببیند برنامه واقعاً چه شکلی است.
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'android-native/app/src/main/**'
      - '.github/workflows/desktop-shots.yml'
  workflow_dispatch:

concurrency:
  group: desktop-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    name: عکس از همهٔ بخش‌ها
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: قلم و نمایشگرِ مجازی
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-noto-core >/dev/null

      #  ‎-Pdev=true‎ بی نشانیِ سرور ⇐ برنامه «بی سرور» است و قفلِ اشتراک نمی‌گیرد،
      #  پس صفحه‌های پولی (قرض‌داران، …) هم در عکس‌ها دیده می‌شوند. نسخهٔ دستِ
      #  کاربر هرگز ‎dev‎ ساخته نمی‌شود.
      - name: کامپایل
        working-directory: desktop
        run: ./gradlew --no-daemon -q -Pdev=true compileKotlin

      - name: دفترِ نمایشی
        run: node desktop/tools/demo-ledger.mjs "$RUNNER_TEMP/tohid-data"

      - name: اجرای برنامه و عکس
        working-directory: desktop
        env:
          TOHID_DATA_DIR: ${{ runner.temp }}/tohid-data
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          #  ساختِ dev صفحهٔ خوش‌آمد را خودش رد می‌کند (پنجره در گوشهٔ ۰،۰ است)
          S="wait:6000;shot:00-start;key:ESCAPE;wait:1500;shot:01-dashboard"
          S="$S;go:admin;wait:2000;shot:01b-admin-center;move:700,500;scroll:8;wait:600;shot:01c-admin-center-lower"
          S="$S;go:sale;wait:1500;shot:02-sale"
          #  صندوقِ سه‌ستونه با سه قلم (اسکن، «3*» و نام + Enter) و نمای جدولیِ کالا
          S="$S;type:626001007;key:ENTER;type:3*626001003;key:ENTER;type:صابون;key:ENTER;wait:1500;shot:02b-sale-cart"
          S="$S;posview:table;wait:1200;shot:02c-sale-table;posview:card;wait:800"
          S="$S;go:quick;wait:1500;shot:03-quick-sale"
          S="$S;go:debtors;wait:1500;shot:04-debtors"
          S="$S;cust:first;wait:1200;shot:04b-customer-ledger;custtab:1;wait:1000;shot:04c-customer-invoices;custtab:2;wait:1000;shot:04d-customer-items;custtab:0;cust:close"
          S="$S;go:warehouse;wait:1500;shot:05-warehouse"
          S="$S;go:products;wait:1500;shot:06-products-table"
          S="$S;prodsel:3;wait:800;shot:06b-products-bulk-bar;prodview:card;wait:1200;shot:06c-products-cards;prodsel:0;prodview:table;wait:800"
          S="$S;go:sales;wait:1500;shot:07-sales-history-cash-shift"
          S="$S;go:purchasing;wait:1500;shot:08-purchasing;new:;wait:1200;shot:08b-purchase-invoice-new;key:ESCAPE;wait:800"
          S="$S;go:reports;wait:1500;shot:09-reports"
          S="$S;move:700,500;scroll:8;shot:10-reports-lower"
          S="$S;go:expenses;wait:1500;shot:11-expenses"
          S="$S;go:more;wait:1500;shot:12-more"
          S="$S;go:settings;wait:1500;shot:13-settings"
          S="$S;go:audit;wait:1500;shot:14-audit-log"
          S="$S;go:team;wait:1500;shot:15-team"
          S="$S;go:devices;wait:1500;shot:15b-devices"
          S="$S;go:vip;wait:1500;shot:15c-subscription-offline-code"
          #  دفترِ موجودی (موتورِ تازهٔ موجودی و بها): خاموش ⇐ روشن با همان راهِ تنظیمات ⇐ زبانه‌ها، انتقال، انبار
          S="$S;go:stockbook;wait:1500;shot:20-stockbook-off;stock:on;wait:3000;shot:20b-stockbook-positions"
          S="$S;stocktab:ledger;wait:1500;shot:20c-stockbook-ledger;stocktab:review;wait:1200;shot:20d-stockbook-review"
          S="$S;stockcount:4;stocktab:count;wait:1800;shot:20e-stockbook-count;stock:transfer;wait:1200;shot:20f-stockbook-transfer;key:ESCAPE;wait:800"
          S="$S;go:warehouse;wait:1800;shot:20g-warehouse-stock-on"
          S="$S;go:dashboard;key:F11;wait:2000;shot:16-fullscreen-dashboard"
          S="$S;help:on;wait:1500;shot:17-shortcuts-F1;help:off"
          S="$S;key:F11;wait:1500;theme:DARK;go:products;wait:1500;shot:18-products-dark;prodsel:2;wait:800;shot:18b-products-dark-bulk;prodsel:0;go:dashboard;wait:1500;shot:19-dashboard-dark;theme:LIGHT"
          export JAVA_TOOL_OPTIONS="-Dtohid.shot=$RUNNER_TEMP/shots -Dtohid.shot.every=9000 -Dtohid.shot.exit=true -Dtohid.shot.script=$S -Dsun.jnu.encoding=UTF-8 -Dfile.encoding=UTF-8"
          timeout 600 xvfb-run -s "-screen 0 1440x900x24" ./gradlew --no-daemon -q -Pdev=true run || true
          ls -la "$RUNNER_TEMP/shots"
          test -n "$(ls "$RUNNER_TEMP/shots")"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14

      #  شاخهٔ جدا، هر بار از نو — فقط عکس‌ها و یک README
      - name: انتشار در شاخهٔ desktop-screenshots
        run: |
          cd "$RUNNER_TEMP/shots"
          {
            echo "# عکس‌های برنامهٔ کامپیوتر"
            echo
            echo "از \`${GITHUB_SHA::7}\` (${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}) — دفترِ نمایشی، نمایشگرِ مجازیِ ۱۴۴۰×۹۰۰."
            echo
            for f in *.png; do echo "## ${f%.png}"; echo; echo "![${f%.png}]($f)"; echo; done
          } > README.md
          git init -q -b desktop-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "عکس‌های برنامهٔ کامپیوتر از ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" desktop-screenshots
