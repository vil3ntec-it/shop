name: کیفیتِ کد

# سنجهٔ کیفیت — مرحلهٔ ۱: فقط گزارش (AUDIT §۳). هیچ کدی را قالب‌بندی یا عوض نمی‌کند.
# هر سنجه جدولش را در «Summary»ِ همین اجرا می‌گذارد؛ راهنمای خواندن و پایین آوردنِ سقف‌ها:
# docs/QUALITY-fa.md. فقط «شمارهٔ تکراریِ مهاجرت» و «قاعده‌های دسترسیِ عامل‌ها» (SEC-AI-02) کار را قرمز
# می‌کنند؛ بقیه continue-on-error‌اند.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای main هرگز وسطِ کار لغو نمی‌شود.
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: سنجهٔ کیفیت
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      #  دو کامیت: HEAD^1 پایهٔ PR (یا کامیتِ قبلیِ main) است ⇒ «همین تغییر» از «از پیش» جدا می‌شود
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: آزمونِ خودِ سنجه
        continue-on-error: true
        run: node --test tools/quality/quality.test.mjs

      #  پارسرِ قراردادِ API (docs/api/routes.json ⇐ tools/api-contract)؛ خودِ مولد سرور را بالا می‌آورد و این‌جا اجرا نمی‌شود
      - name: آزمونِ پارسرِ قراردادِ API (گزارش)
        continue-on-error: true
        run: node --test tools/api-contract/extract.test.cjs

      - name: سقف‌های فقط‌کاهشی — اندازهٔ فایل، کمکی‌های تکراری، pump/shop، index.html، وابستگیِ پلتفرمی (گزارش)
        continue-on-error: true
        run: node tools/quality/quality.mjs --check ratchet

      - name: ESLint روی فایل‌های عوض‌شدهٔ server/src و ES5ِ هسته‌های license (گزارش)
        continue-on-error: true
        run: node tools/quality/quality.mjs --check eslint

      - name: شمارهٔ مهاجرت‌ها (سد)
        if: always()
        run: node tools/quality/quality.mjs --check migrations

      #  SEC-AI-02: «فایلِ secret را نخوان» قاعدهٔ deny ِ .claude/settings.json است، نه متنِ پرامپت
      #  (docs/security/ai-access-fa.md). فقط نامِ مسیرها سنجیده می‌شود؛ هیچ محتوایی خوانده نمی‌شود.
      - name: قاعده‌های دسترسیِ عامل‌ها به فایل‌های secret (سد)
        if: always()
        run: |
          node --test tools/ai-access/check-settings.test.mjs
          node tools/ai-access/check-settings.mjs

  #  فقط گزارش: هر خطایی این‌جا (نصب، وقت، آزمونِ قرمز) کار را قرمز نمی‌کند
  coverage:
    name: پوشش (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: وابستگی‌های سرور
        working-directory: server
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: پوششِ آزمون‌های بی پایگاه‌داده (گزارش)
        continue-on-error: true
        run: node tools/quality/quality.mjs --check coverage
