name: توحید مدیریت

on:
  push:
    #  شاخه‌های claude/** فقط از راهِ PR سنجیده می‌شوند (اجرای دوتایی صفِ Actions را چند ساعت عقب انداخت)
    branches: [main]
    paths:
      - 'admin-android/**'
      - '.github/workflows/tohid-admin.yml'
  # F0-12: PR هم ساخته و آزموده می‌شود تا برنامهٔ شکسته پیش از مرج دیده شود؛
  # انتشار (برچسب و release) **فقط از main** است — شاخه‌ها فقط artifact می‌گیرند.
  pull_request:
    paths:
      - 'admin-android/**'
      - '.github/workflows/tohid-admin.yml'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای main (انتشار) هرگز وسطِ کار لغو نمی‌شود.
  group: tohid-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

#  ⛔ §۱۴ (docs/security/supply-fa.md): ساخت (کدِ PR و وابستگی‌های Gradle) فقط توکنِ خواندنی دارد؛
#  برچسب و انتشار در کارِ جدای «انتشار» با `contents: write` و بی اجرای کدِ ساخت.
permissions:
  contents: read

jobs:
  build:
    name: ساخت برنامهٔ مدیریت
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.name.outputs.apk_name }}
      apk_mb: ${{ steps.name.outputs.apk_mb }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # همان کلیدِ برنامهٔ مشتری. بسته‌ی این برنامه جداست، پس یک کلید
      # برای هر دو مشکلی ندارد و یک چیز کمتر برای گم کردن است.
      - name: کلیدِ امضا
        env:
          KEYSTORE_B64: ${{ secrets.TOHID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tohid-release.jks"
            echo "TOHID_KEYSTORE=$RUNNER_TEMP/tohid-release.jks" >> "$GITHUB_ENV"
            echo "کلید از secret خوانده شد"
          else
            echo "::warning::secret به نام TOHID_KEYSTORE_B64 تنظیم نشده — فعلاً کلیدِ داخلِ مخزن استفاده می‌شود"
          fi

      # F0-12: پیش از ساخت و انتشار. امروز آزمونِ واحدی در admin-android نیست،
      # پس این گام کامپایلِ کدِ release و آزمون‌ها را می‌سنجد و هر آزمونِ تازه‌ای
      # که در app/src/test بیاید خودکار همین‌جا می‌دود.
      - name: آزمون‌های واحد
        working-directory: admin-android
        run: gradle --no-daemon testReleaseUnitTest

      - name: ساخت APK
        working-directory: admin-android
        env:
          TOHID_KEYSTORE_PASSWORD: ${{ secrets.TOHID_KEYSTORE_PASSWORD }}
          TOHID_KEY_ALIAS: ${{ secrets.TOHID_KEY_ALIAS }}
          TOHID_KEY_PASSWORD: ${{ secrets.TOHID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      # نامِ ثابت کنارِ نامِ نسخه‌دار: لینکِ دانلود با هر ساخت نمی‌میرد.
      - name: نام‌گذاری و جمع کنترلی
        id: name
        working-directory: admin-android
        run: |
          mkdir -p out
          version="1.0.${{ github.run_number }}"
          apk=app/build/outputs/apk/release/app-release.apk
          cp "$apk" "out/Tohid-Admin-$version.apk"
          cp "$apk" out/Tohid-Admin.apk
          printf '%s\n' "$version" > out/version.txt
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          echo "apk_name=Tohid-Admin-$version.apk" >> "$GITHUB_OUTPUT"
          echo "apk_mb=$(du -m Tohid-Admin.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tohid-admin-apk
          #  نصبی‌ها، فهرستِ جمعِ کنترلی و شماره — همان‌ها که کارِ «انتشار» می‌فرستد
          path: |
            admin-android/out/*.apk
            admin-android/out/SHA256SUMS.txt
            admin-android/out/version.txt
          if-no-files-found: error
          retention-days: 30

  #  ⛔ §۱۴: فقط این کار توکنِ نوشتنی دارد و هیچ کدِ ساختی در آن اجرا نمی‌شود. فقط از main (F0-12).
  publish:
    name: انتشار
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APK_NAME: ${{ needs.build.outputs.apk_name }}
      APK_MB: ${{ needs.build.outputs.apk_mb }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tohid-admin-apk
          path: admin-android/out

      #  همان `git tag -f` + `push -f` ِ پیشین، بی checkout: برچسب روی همین commit
      - name: جابه‌جا کردن برچسب
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s "admin-android/out/$APK_NAME" && test -s admin-android/out/Tohid-Admin.apk
          if ! gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/tohid-admin" \
                 -f sha='${{ github.sha }}' -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/tohid-admin" -f sha='${{ github.sha }}' >/dev/null
          fi

      - name: انتشار
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: tohid-admin
          name: توحید — برنامهٔ مدیریت
          prerelease: true
          files: |
            admin-android/out/*.apk
            admin-android/out/SHA256SUMS.txt
            admin-android/out/version.txt
          body: |
            ## توحید — برنامهٔ مدیریت

            برنامه‌ی دوم، فقط برای صاحب سامانه. بسته‌اش جداست
            (`ir.vil3ntec.tohid.admin`) و کنار برنامه‌ی مشتری نصب می‌شود.

            **دانلود:** [Tohid-Admin.apk](https://github.com/${{ github.repository }}/releases/download/tohid-admin/Tohid-Admin.apk) — نسخهٔ `${{ env.APK_NAME }}`، حدود ${{ env.APK_MB }} مگابایت

            > این لینک همیشه تازه‌ترین نسخه را می‌دهد و با ساخت بعدی نمی‌میرد.

            بار اول، آدرس سرور و نام کاربری و رمز مدیر را می‌زنید.

            ---
            <sub>ساخته‌شده از `${{ github.sha }}`</sub>

      - name: پاک کردن نسخه‌های قبلی
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/tohid-admin" \
            | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in
                "${{ env.APK_NAME }}"|Tohid-Admin.apk|SHA256SUMS.txt|version.txt) ;;
                *) gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" ;;
              esac
            done
