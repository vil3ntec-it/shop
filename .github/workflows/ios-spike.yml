name: ios-spike

#  آزمایشِ امکانِ آیفون: آیا `core` (منطقِ خالص، commonMain) برای iOS کامپایل
#  می‌شود و آزمون‌هایش روی شبیه‌سازِ iOS سبزند؟ هدف‌های iOS فقط با `-Pios=true`
#  روشن می‌شوند (core/build.gradle.kts)، پس ساختِ اندروید و کامپیوتر دست نمی‌خورد.
#  بی رمز، بی امضا، بی انتشار.
#  از ۱۴۰۵/۰۸/۱۲: رابطِ مشترکِ آیفون (`ios/shared` + `ios/iosApp`، گامِ ۱ِ docs/IOS-PLAN-fa.md) هم
#  همین‌جا ساخته می‌شود — همه «گزارش»، هیچ‌کدام سدِ ادغام نیستند.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - 'ios/**'
      - '.github/workflows/ios-spike.yml'

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  #  نگهبانِ ارزان (گامِ ۰ِ docs/IOS-PLAN-fa.md): commonMain برای linuxX64 (Kotlin/Native، بی JDK و بی Xcode)
  #  روی ubuntu کامپایل می‌شود ⇒ هر java.*/javax.* ِ تازه در commonMain همین‌جا خطا می‌دهد. فعلاً گزارش.
  core-native:
    name: کامپایلِ commonMain برای linuxX64 (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: compileKotlinLinuxX64
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pnative=true compileKotlinLinuxX64

  ios:
    name: کامپایلِ core برای iOS و آزمون روی شبیه‌ساز
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      #  ابزارهای Kotlin/Native (~/.konan) سنگین‌اند؛ نگه‌شان می‌داریم
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      #  core خودش gradlew ندارد؛ همان wrapperِ desktop (Gradle 8.14.3) با `-p`
      - name: compileKotlinIosArm64 و iosSimulatorArm64Test
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pios=true compileKotlinIosArm64 iosSimulatorArm64Test
      #  گواهِ این‌که آزمون‌ها واقعاً روی شبیه‌ساز اجرا شدند (شمارِ tests/failures)
      - name: خلاصهٔ آزمون‌های شبیه‌ساز
        if: always()
        working-directory: core
        run: grep -ho '<testsuite [^>]*' build/test-results/iosSimulatorArm64Test/*.xml || echo "گزارشِ آزمون نیست"

  #  رابطِ مشترکِ آیفون، ارزان (گامِ ۱): klib ِ `ios/shared` برای شبیه‌ساز روی ubuntu (کامپایلِ
  #  klib ِ Apple روی لینوکس، `kotlin.native.enableKlibsCrossCompilation` در ios/shared/gradle.properties).
  #  همان خطاهای کامپایلِ macOS را بی Xcode و بی دقیقهٔ گرانِ مک نشان می‌دهد.
  ios-ui-klib:
    name: رابطِ مشترکِ آیفون — klib روی لینوکس (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-ui-${{ runner.os }}-${{ hashFiles('ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      #  klib ِ شبیه‌ساز + آزمونِ خالصِ حالتِ GCM ِ دفترِ رمزدار در برابرِ خودِ JDK (همان بایت‌های اندروید/کامپیوتر)
      - name: compileKotlinIosSimulatorArm64 و jvmTest (ios/shared)
        run: ./desktop/gradlew --no-daemon -p ios/shared -Pios=true compileKotlinIosSimulatorArm64 jvmTest

  #  برنامهٔ آیفون روی macOS: چارچوبِ Compose (`TohidShared`)، برنامهٔ Xcode برای شبیه‌ساز بی امضا،
  #  و یک بار اجرا روی شبیه‌ساز با عکس. امضا و انتشار BLOCKED-EXTERNAL است (حسابِ اپل ِ صاحب‌کار).
  ios-app:
    name: برنامهٔ آیفون — چارچوب، Xcode و شبیه‌ساز (گزارش)
    runs-on: macos-latest
    timeout-minutes: 75
    continue-on-error: true
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-ui-${{ runner.os }}-${{ hashFiles('ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      #  ۱) چارچوبِ Kotlin/Compose برای شبیه‌سازِ arm64 (کامپایلِ klib + پیوند)
      - name: linkDebugFrameworkIosSimulatorArm64 (ios/shared)
        run: ./desktop/gradlew --no-daemon -p ios/shared -Pios=true linkDebugFrameworkIosSimulatorArm64
      #  ۲) برنامهٔ Xcode — مرحلهٔ «Compile Kotlin Framework» همان چارچوب را با embedAndSignAppleFrameworkForXcode برمی‌دارد
      - name: xcodebuild (شبیه‌ساز، بی امضا)
        run: |
          xcodebuild -project ios/iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/ios/iosApp/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ls -la ios/iosApp/build/Debug-iphonesimulator/iosApp.app
      #  ۳) یک بار روی شبیه‌ساز: نصب، اجرا، عکس، و آیا پس از ۲۰ ثانیه هنوز زنده است
      - name: اجرا روی شبیه‌ساز و عکس
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/iosApp/build/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" ir.vil3ntec.tohid
          sleep 20
          mkdir -p ios-shots
          xcrun simctl io "$UDID" screenshot ios-shots/ios-app.png
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "iosApp"' > ios-shots/ios-app.log 2>&1 || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'ir.vil3ntec.tohid'; then echo "برنامه پس از ۲۰ ثانیه زنده است"; else echo "::warning::برنامه پس از ۲۰ ثانیه زنده نیست (ios-shots/ios-app.log)"; exit 1; fi
      #  ۴) shimهای رمزنگاری روی شبیه‌ساز (CommonCrypto/Keychain) در برابرِ بردارهای JDK — `src/iosTest`
      - name: iosSimulatorArm64Test (ios/shared)
        if: always()
        run: |
          ./desktop/gradlew --no-daemon -p ios/shared -Pios=true iosSimulatorArm64Test
          grep -ho '<testsuite [^>]*' ios/shared/build/test-results/iosSimulatorArm64Test/*.xml || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-app-shots
          path: ios-shots/
          if-no-files-found: ignore
