name: ios-spike

#  آزمایشِ امکانِ آیفون: آیا `core` (منطقِ خالص، commonMain) برای iOS کامپایل
#  می‌شود و آزمون‌هایش روی شبیه‌سازِ iOS سبزند؟ هدف‌های iOS فقط با `-Pios=true`
#  روشن می‌شوند (core/build.gradle.kts)، پس ساختِ اندروید و کامپیوتر دست نمی‌خورد.
#  بی رمز، بی امضا، بی انتشار.
#  از ۱۴۰۵/۰۸/۱۲: رابطِ مشترکِ آیفون (`ios/shared` + `ios/iosApp`، گامِ ۱ِ docs/IOS-PLAN-fa.md) هم
#  همین‌جا ساخته می‌شود — همه «گزارش»، هیچ‌کدام سدِ ادغام نیستند.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - 'ios/**'
      - '.github/workflows/ios-spike.yml'

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  #  نگهبانِ ارزان (گامِ ۰ِ docs/IOS-PLAN-fa.md): commonMain برای linuxX64 (Kotlin/Native، بی JDK و بی Xcode)
  #  روی ubuntu کامپایل می‌شود ⇒ هر java.*/javax.* ِ تازه در commonMain همین‌جا خطا می‌دهد. فعلاً گزارش.
  core-native:
    name: کامپایلِ commonMain برای linuxX64 (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: compileKotlinLinuxX64
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pnative=true compileKotlinLinuxX64

  ios:
    name: کامپایلِ core برای iOS و آزمون روی شبیه‌ساز
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      #  ابزارهای Kotlin/Native (~/.konan) سنگین‌اند؛ نگه‌شان می‌داریم
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      #  core خودش gradlew ندارد؛ همان wrapperِ desktop (Gradle 8.14.3) با `-p`
      - name: compileKotlinIosArm64 و iosSimulatorArm64Test
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pios=true compileKotlinIosArm64 iosSimulatorArm64Test
      #  گواهِ این‌که آزمون‌ها واقعاً روی شبیه‌ساز اجرا شدند (شمارِ tests/failures)
      - name: خلاصهٔ آزمون‌های شبیه‌ساز
        if: always()
        working-directory: core
        run: grep -ho '<testsuite [^>]*' build/test-results/iosSimulatorArm64Test/*.xml || echo "گزارشِ آزمون نیست"

  #  رابطِ مشترکِ آیفون، ارزان (گامِ ۱): klib ِ `ios/shared` برای شبیه‌ساز روی ubuntu (کامپایلِ
  #  klib ِ Apple روی لینوکس، `kotlin.native.enableKlibsCrossCompilation` در ios/shared/gradle.properties).
  #  همان خطاهای کامپایلِ macOS را بی Xcode و بی دقیقهٔ گرانِ مک نشان می‌دهد.
  ios-ui-klib:
    name: رابطِ مشترکِ آیفون — klib روی لینوکس (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-ui-${{ runner.os }}-${{ hashFiles('ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      #  klib ِ شبیه‌ساز + klib ِ آزمون‌های شبیه‌ساز (از گامِ ۸ آزمونِ سرتاسری هم؛ خطای کامپایلش این‌جا، نه پس از دقیقه‌های مک)
      #  + آزمونِ خالصِ حالتِ GCM ِ دفترِ رمزدار در برابرِ خودِ JDK (همان بایت‌های اندروید/کامپیوتر)
      - name: compileKotlinIosSimulatorArm64، compileTestKotlinIosSimulatorArm64 و jvmTest (ios/shared)
        run: ./desktop/gradlew --no-daemon -p ios/shared -Pios=true compileKotlinIosSimulatorArm64 compileTestKotlinIosSimulatorArm64 jvmTest

  #  برنامهٔ آیفون روی macOS: چارچوبِ Compose (`TohidShared`)، برنامهٔ Xcode برای شبیه‌ساز بی امضا،
  #  و یک بار اجرا روی شبیه‌ساز با عکس. امضا و انتشار BLOCKED-EXTERNAL است (حسابِ اپل ِ صاحب‌کار).
  #  ۷۵ دقیقه کم بود: گامِ ۴ (#841) هر چهار مرحله را سبز گذراند (پیوند ~۳۰، xcodebuild ~۱۷، اجرا ~۶، آزمون ~۲۲ دقیقه)
  #  و کار در ذخیرهٔ کشِ پایانی «لغو» شد. هزینهٔ اجرای کامل همان است؛ فقط سرخِ دروغ در پایان نمی‌آید.
  #  گامِ ۸ (docs/IOS-PLAN-fa.md §۰.۱۳): آزمونِ سرتاسریِ جریان‌های اصلی در همان `iosSimulatorArm64Test` با سرورِ واقعیِ
  #  مخزن روی PGlite (`ios/e2e/backend.mjs`) و عکسِ هر گام (مصنوعِ `ios-e2e-shots`) ⇐ سقف ۱۱۵ دقیقه.
  #  کار همچنان «گزارش» و continue-on-error است؛ درونش هر گام سخت‌گیر است (سرخ ⇐ همان مرحله سرخ).
  ios-app:
    name: برنامهٔ آیفون — چارچوب، Xcode و شبیه‌ساز (گزارش)
    runs-on: macos-latest
    timeout-minutes: 115
    continue-on-error: true
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-ui-${{ runner.os }}-${{ hashFiles('ios/shared/build.gradle.kts', 'core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      #  ۱) چارچوبِ Kotlin/Compose برای شبیه‌سازِ arm64 (کامپایلِ klib + پیوند)
      - name: linkDebugFrameworkIosSimulatorArm64 (ios/shared)
        run: ./desktop/gradlew --no-daemon -p ios/shared -Pios=true linkDebugFrameworkIosSimulatorArm64
      #  ۲) برنامهٔ Xcode — مرحلهٔ «Compile Kotlin Framework» همان چارچوب را با embedAndSignAppleFrameworkForXcode برمی‌دارد
      - name: xcodebuild (شبیه‌ساز، بی امضا)
        run: |
          xcodebuild -project ios/iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/ios/iosApp/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          ls -la ios/iosApp/build/Debug-iphonesimulator/iosApp.app
      #  ۳) یک بار روی شبیه‌ساز: نصب، اجرا، عکس، و آیا پس از ۲۰ ثانیه هنوز زنده است
      - name: اجرا روی شبیه‌ساز و عکس
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/iosApp/build/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$UDID" ir.vil3ntec.tohid
          sleep 20
          mkdir -p ios-shots
          xcrun simctl io "$UDID" screenshot ios-shots/ios-app.png
          xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "iosApp"' > ios-shots/ios-app.log 2>&1 || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'ir.vil3ntec.tohid'; then echo "برنامه پس از ۲۰ ثانیه زنده است"; else echo "::warning::برنامه پس از ۲۰ ثانیه زنده نیست (ios-shots/ios-app.log)"; exit 1; fi
      #  ۴) سرورِ آزمونِ سرتاسری (گامِ ۸): همان سرورِ مخزن روی PGlite ِ در حافظه، فقط 127.0.0.1، با صاحبِ دکان (ایمیل و رمز)
      #  و یک کالای موجود از دستگاهِ دیگرِ همان دکان؛ شبیه‌ساز شبکهٔ همین مک را دارد
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: always()
        with:
          node-version: '22'
      - name: سرورِ آزمونِ سرتاسری (PGlite)
        if: always()
        run: |
          (cd server && npm ci --no-audit --no-fund)
          mkdir -p ios-e2e/shots
          node ios/e2e/backend.mjs "$PWD/ios-e2e/backend.json" > ios-e2e/backend.log 2>&1 &
          echo $! > ios-e2e/backend.pid
          for i in $(seq 1 90); do [ -s ios-e2e/backend.json ] && break; sleep 1; done
          if [ ! -s ios-e2e/backend.json ]; then tail -60 ios-e2e/backend.log; echo "::error::سرورِ آزمون بالا نیامد"; exit 1; fi
          tail -1 ios-e2e/backend.log
      #  ۵) روی شبیه‌ساز: shimهای رمزنگاری (CommonCrypto/Keychain) در برابرِ بردارهای JDK، shimهای گام‌های ۳ تا ۷، و
      #  آزمونِ سرتاسریِ جریان‌های اصلی (`src/iosTest/…/e2e/CoreFlowsE2EIosTest`: ورود، صندوق، کالا، «تازه‌ها»، نسیه با قرض‌دار،
      #  کادرِ صندوقِ خانه و «+»، سفارشِ آنلاین تا یک فاکتور، دری — §۰.۱۳ و §۰.۱۵)
      - name: iosSimulatorArm64Test (ios/shared) — رمز، shimها و جریان‌های اصلی
        if: always()
        #  کامپایل و پیوندِ آزمون ~۱۲، آزمونِ سرتاسری ≤ ۲۰ دقیقه (نگهبانِ خودش)؛ گیرِ دیگر کارِ ۱۱۵ دقیقه‌ای را نخورد
        timeout-minutes: 45
        env:
          TOHID_E2E_BACKEND: ${{ github.workspace }}/ios-e2e/backend.json
          TOHID_E2E_SHOTS: ${{ github.workspace }}/ios-e2e/shots
        run: |
          set +e
          #  گیرِ رشتهٔ اصلی (نگهبانِ آزمون فقط «کدام گام» را می‌گوید): e2e.log سه دقیقه بی‌حرکت ⇐ پشتهٔ همهٔ رشته‌های
          #  test.kexe با `sample`، پیش از آن‌که نگهبانِ ۲۰ دقیقه‌ای فرآیند را ببندد — کدام قفل، کدام تابع، کدام رشته
          (
            while sleep 20; do
              f=ios-e2e/shots/e2e.log
              [ -f "$f" ] || continue
              [ $(( $(date +%s) - $(stat -f %m "$f") )) -lt 180 ] && continue
              for p in $(pgrep -f 'test\.kexe'); do sudo sample "$p" 3 -file "ios-e2e/shots/hang-sample-$p.txt" >/dev/null 2>&1; done
              break
            done
          ) &
          hang=$!
          ./desktop/gradlew --no-daemon -p ios/shared -Pios=true iosSimulatorArm64Test
          rc=$?
          kill "$hang" 2>/dev/null
          for f in ios-e2e/shots/hang-sample-*.txt; do [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }; done
          grep -ho '<testsuite [^>]*' ios/shared/build/test-results/iosSimulatorArm64Test/*.xml
          if [ -s ios-e2e/shots/summary.md ]; then cat ios-e2e/shots/summary.md >> "$GITHUB_STEP_SUMMARY"; cat ios-e2e/shots/summary.md; else echo "::warning::جدولِ آزمونِ سرتاسری نیست (ios-e2e/shots/summary.md)"; fi
          #  لاگِ گام‌ها و درختِ دسترس‌پذیریِ هر گامِ سرخ همین‌جا هم (بی دانلودِ مصنوع)
          if [ -f ios-e2e/shots/e2e.log ]; then echo "::group::e2e.log"; cat ios-e2e/shots/e2e.log; echo "::endgroup::"; fi
          for f in ios-e2e/shots/*FAIL*.txt; do [ -f "$f" ] && { echo "::group::$f"; head -400 "$f"; echo "::endgroup::"; }; done
          #  درخواست‌هایی که سرورِ آزمون از برنامه گرفت (ورود، همگام‌سازی، …) — بی دانلودِ مصنوع
          if [ -f ios-e2e/backend.log ]; then echo "::group::backend.log (پایان)"; tail -150 ios-e2e/backend.log; echo "::endgroup::"; fi
          ls -la ios-e2e/shots 2>/dev/null || true
          exit $rc
      #  کوچک‌شدهٔ هر عکس (JPEG ِ ۵۲۰ نقطه، base64 میانِ THUMB-BEGIN/THUMB-END) در لاگ: سیزن‌های Claude مصنوع را
      #  دانلود نمی‌توانند ولی لاگ را می‌خوانند؛ صاحب‌کار همان مصنوعِ ios-e2e-shots را با کیفیتِ کامل می‌بیند
      - name: کوچک‌شدهٔ عکس‌های آزمونِ سرتاسری در لاگ
        if: always()
        run: |
          mkdir -p ios-e2e/thumbs
          for f in ios-e2e/shots/*.png; do
            [ -f "$f" ] || continue
            t="ios-e2e/thumbs/$(basename "${f%.png}").jpg"
            sips -s format jpeg -s formatOptions 50 -Z 520 "$f" --out "$t" >/dev/null 2>&1 || continue
            echo "THUMB-BEGIN $(basename "$t")"; base64 -i "$t" | fold -w 120; echo "THUMB-END"
          done
      #  پشتهٔ گیر **پس از** THUMB ها: `get_job_logs` فقط ۵۰۰۰ خطِ آخر را می‌دهد و پشتهٔ کاملِ گامِ آزمون (پیش از عکس‌ها) بیرون
      #  می‌افتد ⇐ از هر hang-sample فقط رشتهٔ اصلی و رشته‌های ایستاده روی NSRecursiveLock / semaphore_wait / dispatch_sync، هر کدام
      #  ≤ ۸۰ خط (`ios/e2e/hang-threads.py`؛ همان در `ios-e2e/shots/hang-threads.txt` ِ مصنوع). بی گیر ⇐ یک سطر.
      - name: پشتهٔ رشته‌های گیرکرده (hang-sample، کوتاه)
        if: always()
        run: |
          ls ios-e2e/shots/hang-sample-*.txt >/dev/null 2>&1 || { echo "گیری نبود (hang-sample-*.txt نیست)"; exit 0; }
          python3 ios/e2e/hang-threads.py ios-e2e/shots/hang-sample-*.txt | tee ios-e2e/shots/hang-threads.txt
      - name: پایانِ سرورِ آزمون
        if: always()
        run: |
          [ -f ios-e2e/backend.pid ] && kill "$(cat ios-e2e/backend.pid)" 2>/dev/null || true
          cp ios/shared/build/test-results/iosSimulatorArm64Test/*.xml ios-e2e/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-app-shots
          path: ios-shots/
          if-no-files-found: ignore
      #  عکسِ هر گامِ آزمونِ سرتاسری (۳۹۰×۸۴۴، ۳x) + درختِ دسترس‌پذیری، `summary.md`، `e2e.log`، لاگِ سرور و نتیجهٔ آزمون‌ها
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ios-e2e-shots
          path: ios-e2e/
          if-no-files-found: ignore
