name: ios-spike

#  آزمایشِ امکانِ آیفون: آیا `core` (منطقِ خالص، commonMain) برای iOS کامپایل
#  می‌شود و آزمون‌هایش روی شبیه‌سازِ iOS سبزند؟ هدف‌های iOS فقط با `-Pios=true`
#  روشن می‌شوند (core/build.gradle.kts)، پس ساختِ اندروید و کامپیوتر دست نمی‌خورد.
#  بی رمز، بی امضا، بی انتشار.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/ios-spike.yml'

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  #  نگهبانِ ارزان (گامِ ۰ِ docs/IOS-PLAN-fa.md): commonMain برای linuxX64 (Kotlin/Native، بی JDK و بی Xcode)
  #  روی ubuntu کامپایل می‌شود ⇒ هر java.*/javax.* ِ تازه در commonMain همین‌جا خطا می‌دهد. فعلاً گزارش.
  core-native:
    name: کامپایلِ commonMain برای linuxX64 (گزارش)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: compileKotlinLinuxX64
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pnative=true compileKotlinLinuxX64

  ios:
    name: کامپایلِ core برای iOS و آزمون روی شبیه‌ساز
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      #  ابزارهای Kotlin/Native (~/.konan) سنگین‌اند؛ نگه‌شان می‌داریم
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('core/build.gradle.kts') }}
      - name: نسخهٔ Xcode
        run: xcodebuild -version
      #  core خودش gradlew ندارد؛ همان wrapperِ desktop (Gradle 8.14.3) با `-p`
      - name: compileKotlinIosArm64 و iosSimulatorArm64Test
        working-directory: core
        run: ../desktop/gradlew --no-daemon -Pios=true compileKotlinIosArm64 iosSimulatorArm64Test
      #  گواهِ این‌که آزمون‌ها واقعاً روی شبیه‌ساز اجرا شدند (شمارِ tests/failures)
      - name: خلاصهٔ آزمون‌های شبیه‌ساز
        if: always()
        working-directory: core
        run: grep -ho '<testsuite [^>]*' build/test-results/iosSimulatorArm64Test/*.xml || echo "گزارشِ آزمون نیست"
