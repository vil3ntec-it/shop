name: توحید بومی

on:
  push:
    branches: ['claude/**', main]
    paths:
      - 'android-native/**'
      - '.github/workflows/tohid-native.yml'
  workflow_dispatch:

concurrency:
  group: tohid-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ساخت نسخهٔ بومی
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # کلیدِ امضا از secret می‌آید، نه از داخلِ مخزن.
      #
      # تا وقتی secret تنظیم نشده باشد، همان فایلِ داخلِ مخزن استفاده
      # می‌شود و ساخت نمی‌شکند. بعد از تنظیمِ secret، آن فایل را می‌شود
      # از مخزن برداشت و از آن لحظه کلید فقط اینجا باز می‌شود.
      - name: کلیدِ امضا
        env:
          KEYSTORE_B64: ${{ secrets.TOHID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tohid-release.jks"
            echo "TOHID_KEYSTORE=$RUNNER_TEMP/tohid-release.jks" >> "$GITHUB_ENV"
            echo "کلید از secret خوانده شد"
          else
            echo "::warning::secret به نام TOHID_KEYSTORE_B64 تنظیم نشده — فعلاً کلیدِ داخلِ مخزن استفاده می‌شود"
          fi

      - name: سنجشِ حساب‌ها
        working-directory: android-native
        run: gradle --no-daemon testReleaseUnitTest

      - name: ساخت APK
        working-directory: android-native
        env:
          TOHID_KEYSTORE_PASSWORD: ${{ secrets.TOHID_KEYSTORE_PASSWORD }}
          TOHID_KEY_ALIAS: ${{ secrets.TOHID_KEY_ALIAS }}
          TOHID_KEY_PASSWORD: ${{ secrets.TOHID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: نام‌گذاری و جمع کنترلی
        working-directory: android-native
        run: |
          mkdir -p out
          version=$(gradle --no-daemon -q printVersionName -PbuildNumber=${{ github.run_number }} | tail -n1)
          apk=app/build/outputs/apk/release/app-release.apk
          cp "$apk" "out/Tohid-Native-$version.apk"
          #  همان فایل، یک بار هم با نامِ ثابت.
          #
          #  نامِ نسخه‌دار خوب است چون آدم می‌داند چه گرفته، ولی هر ساخت
          #  فایلِ قبلی را پاک می‌کند و هر لینکی که جایی فرستاده شده باشد
          #  می‌میرد. این یکی هیچ‌وقت نمی‌میرد.
          cp "$apk" out/Tohid-Native.apk
          #  شمارهٔ نسخه، بیرون از API.
          #
          #  به‌روزرسانیِ داخلِ برنامه تا حالا فقط از api.github.com
          #  می‌پرسید و آن سهمیهٔ ساعتی دارد و جاهایی هم بسته است. این
          #  فایل از همان مسیرِ دانلود خوانده می‌شود، بدون سهمیه.
          printf '%s\n' "$version" > out/version.txt
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
          echo "APK_NAME=Tohid-Native-$version.apk" >> "$GITHUB_ENV"
          echo "APK_MB=$(du -m Tohid-Native.apk | cut -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Tohid-Native
          path: android-native/out/*
          if-no-files-found: error
          retention-days: 30

      - name: جابه‌جا کردن برچسب
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/tohid-native" \
                 -f sha='${{ github.sha }}' -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref='refs/tags/tohid-native' -f sha='${{ github.sha }}' >/dev/null
          fi

      - name: انتشار
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tohid-native
          name: توحید — نسخهٔ بومی اندروید
          prerelease: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: |
            android-native/out/*.apk
            android-native/out/SHA256SUMS.txt
            android-native/out/version.txt
          body: |
            ## توحید — نسخهٔ بومی اندروید

            بازنویسی کامل با Kotlin و Jetpack Compose. بدون HTML، بدون WebView.

            **دانلود:** [Tohid-Native.apk](https://github.com/${{ github.repository }}/releases/download/tohid-native/Tohid-Native.apk) — نسخهٔ `${{ env.APK_NAME }}`، حدود ${{ env.APK_MB }} مگابایت

            > این لینک همیشه تازه‌ترین نسخه را می‌دهد و با ساختِ بعدی نمی‌میرد.

            > این نسخه **در حال ساخت** است. مرحله‌به‌مرحله کامل می‌شود و هر
            > مرحله از داخل خود برنامه به‌روزرسانی می‌گیرد.

            ---
            <sub>ساخته‌شده از `${{ github.sha }}`</sub>

      - name: پاک کردن نسخه‌های قبلی
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #  هر چیزی جز فایل‌های همین ساخت برداشته می‌شود. «Tohid-Native.apk»
          #  و «version.txt» همیشه می‌مانند — لینکِ ثابت و شمارهٔ نسخه به
          #  آنها بسته است.
          gh api "repos/${{ github.repository }}/releases/tags/tohid-native" \
            | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in
                "${{ env.APK_NAME }}"|Tohid-Native.apk|SHA256SUMS.txt|version.txt) ;;
                *) gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" ;;
              esac
            done
