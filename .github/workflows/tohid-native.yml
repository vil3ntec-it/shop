name: توحید بومی

on:
  push:
    branches: ['claude/**', main]
    paths:
      - 'android-native/**'
      - '.github/workflows/tohid-native.yml'
  # PR هم ساخته می‌شود تا APKِ شکسته پیش از مرج دیده شود؛ انتشار فقط از main است
  pull_request:
    paths:
      - 'android-native/**'
      #  بردارهای مرجعِ مشترک با JS (StockCoreVectorsTest همین‌ها را می‌خواند)
      - 'license/test-vectors/**'
      - '.github/workflows/tohid-native.yml'
  #  ⛔ F0-27: push به main فقط کانالِ آزمایشی (`tohid-native-beta`) را می‌سازد.
  #  برچسبِ پایدار (`tohid-native`، همان که همهٔ گوشی‌ها می‌پرسند) فقط از این‌جا:
  #  Actions ⇒ «توحید بومی» ⇒ Run workflow ⇒ شاخهٔ main ⇒ channel = stable.
  workflow_dispatch:
    inputs:
      channel:
        description: 'کانال: beta (فقط دکان‌ها و دستگاه‌های آزمایشی) یا stable (همهٔ دکان‌ها)'
        type: choice
        options: [beta, stable]
        default: beta

concurrency:
  #  انتشارِ پایدار با pushِ بعدی لغو نشود
  group: tohid-native-${{ github.ref }}-${{ inputs.channel || 'push' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ساخت نسخهٔ بومی
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      #  کدام برچسب؟ فقط main منتشر می‌کند؛ پایدار فقط با workflow_dispatch.
      #  نصبیِ آزمایشی به `.apk` ختم نمی‌شود (`….apk.beta`): برنامه‌های نصب‌شده
      #  وقتی سرور در دسترس نیست از api.github.com فهرستِ انتشارها را می‌خوانند و
      #  اولین `.apk`ی را که ببینند برمی‌دارند — نسخهٔ آزمایشی نباید به آن‌ها برسد.
      - name: کانال
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.channel }}" = "stable" ]; then
            printf 'PUBLISH=true\nCHANNEL=stable\nTAG=tohid-native\n' >> "$GITHUB_ENV"
          else
            printf 'PUBLISH=true\nCHANNEL=beta\nTAG=tohid-native-beta\n' >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # کلیدِ امضا از secret می‌آید، نه از داخلِ مخزن.
      #
      # تا وقتی secret تنظیم نشده باشد، همان فایلِ داخلِ مخزن استفاده
      # می‌شود و ساخت نمی‌شکند. بعد از تنظیمِ secret، آن فایل را می‌شود
      # از مخزن برداشت و از آن لحظه کلید فقط اینجا باز می‌شود.
      - name: کلیدِ امضا
        env:
          KEYSTORE_B64: ${{ secrets.TOHID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tohid-release.jks"
            echo "TOHID_KEYSTORE=$RUNNER_TEMP/tohid-release.jks" >> "$GITHUB_ENV"
            echo "کلید از secret خوانده شد"
          else
            echo "::warning::secret به نام TOHID_KEYSTORE_B64 تنظیم نشده — فعلاً کلیدِ داخلِ مخزن استفاده می‌شود"
          fi

      - name: سنجشِ حساب‌ها
        working-directory: android-native
        run: gradle --no-daemon testReleaseUnitTest

      - name: ساخت APK
        working-directory: android-native
        env:
          TOHID_KEYSTORE_PASSWORD: ${{ secrets.TOHID_KEYSTORE_PASSWORD }}
          TOHID_KEY_ALIAS: ${{ secrets.TOHID_KEY_ALIAS }}
          TOHID_KEY_PASSWORD: ${{ secrets.TOHID_KEY_PASSWORD }}
          #  دامنهٔ عمومیِ API.
          #
          #  `vars` است نه `secrets`: این نشانی راز نیست — هر کسی که
          #  برنامه را باز کند با همین دامنه حرف می‌زند و از روی ترافیک
          #  دیده می‌شود. راز، چیزهایی است که فقط روی سرور می‌مانند:
          #  رمز دیتابیس، کلید پیامک، توکن واتساپ، راز مدیر.
          #
          #  اگر تنظیم نشده باشد خالی می‌ماند و برنامه کاملاً آفلاین کار
          #  می‌کند — نه خطایی، نه قابلیتی که قفل شود.
          TOHID_API_BASE: ${{ vars.TOHID_API_BASE }}
          TOHID_UPDATE_PUBLIC_KEY: ${{ vars.TOHID_UPDATE_PUBLIC_KEY }}
          #  کلیدِ عمومیِ مجوز (همان `GET /api/license/public-key`) — سنجاق در خودِ
          #  برنامه تا هیچ مجوز یا کدِ آفلاینِ جعلی پذیرفته نشود. راز نیست ⇒ `vars`.
          TOHID_LICENSE_PUBLIC_KEY: ${{ vars.TOHID_LICENSE_PUBLIC_KEY }}
        run: gradle --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: نام‌گذاری و جمع کنترلی
        working-directory: android-native
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.TOHID_UPDATE_SIGNING_KEY }}
          TOHID_UPDATE_PUBLIC_KEY: ${{ vars.TOHID_UPDATE_PUBLIC_KEY }}
        run: |
          mkdir -p out
          version=$(gradle --no-daemon -q printVersionName -PbuildNumber=${{ github.run_number }} | tail -n1)
          apk=app/build/outputs/apk/release/app-release.apk
          if [ "$CHANNEL" = beta ]; then
            cp "$apk" "out/Tohid-Native-$version.apk.beta"
            printf '%s\n' "$version" > out/version.txt
            (cd out && sha256sum *.apk.beta > SHA256SUMS.txt && cat SHA256SUMS.txt)
            echo "APK_NAME=Tohid-Native-$version.apk.beta" >> "$GITHUB_ENV"
          else
          cp "$apk" "out/Tohid-Native-$version.apk"
          #  همان فایل، یک بار هم با نامِ ثابت.
          #
          #  نامِ نسخه‌دار خوب است چون آدم می‌داند چه گرفته، ولی هر ساخت
          #  فایلِ قبلی را پاک می‌کند و هر لینکی که جایی فرستاده شده باشد
          #  می‌میرد. این یکی هیچ‌وقت نمی‌میرد.
          cp "$apk" out/Tohid-Native.apk
          #  شمارهٔ نسخه، بیرون از API.
          #
          #  به‌روزرسانیِ داخلِ برنامه تا حالا فقط از api.github.com
          #  می‌پرسید و آن سهمیهٔ ساعتی دارد و جاهایی هم بسته است. این
          #  فایل از همان مسیرِ دانلود خوانده می‌شود، بدون سهمیه.
          printf '%s\n' "$version" > out/version.txt
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "APK_NAME=Tohid-Native-$version.apk" >> "$GITHUB_ENV"
          fi
          cd out
          #  امضای جدای فهرست — شرح سرِ `update/ReleaseSignature.kt`.
          #  کلیدِ عمومی که در برنامه سنجاق شود ولی امضایش نیاید، یعنی
          #  هیچ گوشی‌ای به‌روز نمی‌شود؛ پس این حالت ساخت را می‌شکند.
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.pem"
            openssl dgst -sha256 -sign "$RUNNER_TEMP/update.pem" SHA256SUMS.txt | base64 -w0 > SHA256SUMS.txt.sig
            rm -f "$RUNNER_TEMP/update.pem"
            echo "فهرست امضا شد"
          elif [ -n "$TOHID_UPDATE_PUBLIC_KEY" ]; then
            echo "::error::کلیدِ عمومیِ به‌روزرسانی سنجاق شده ولی secretِ TOHID_UPDATE_SIGNING_KEY نیست"
            exit 1
          fi
          echo "APK_MB=$(du -m "$(ls *.apk *.apk.beta 2>/dev/null | head -n1)" | cut -f1)" >> "$GITHUB_ENV"

      #  نسخهٔ کافه‌بازار — همان کد با `-Pstore=bazaar`: بی به‌روزرسانیِ داخلی،
      #  بی اجازهٔ نصبِ بسته و بی دکمهٔ خرید با واتساپ (قانونِ بازار). همان
      #  کلید و همان بسته؛ فقط روی انتشار می‌نشیند تا صاحب در پنلِ بازار
      #  بارش کند — به‌روزرسانیِ داخلیِ برنامه هرگز سراغش نمی‌رود.
      - name: نسخهٔ کافه‌بازار
        working-directory: android-native
        env:
          TOHID_KEYSTORE_PASSWORD: ${{ secrets.TOHID_KEYSTORE_PASSWORD }}
          TOHID_KEY_ALIAS: ${{ secrets.TOHID_KEY_ALIAS }}
          TOHID_KEY_PASSWORD: ${{ secrets.TOHID_KEY_PASSWORD }}
          TOHID_API_BASE: ${{ vars.TOHID_API_BASE }}
          TOHID_UPDATE_PUBLIC_KEY: ${{ vars.TOHID_UPDATE_PUBLIC_KEY }}
          TOHID_LICENSE_PUBLIC_KEY: ${{ vars.TOHID_LICENSE_PUBLIC_KEY }}
        run: |
          gradle --no-daemon assembleRelease -Pstore=bazaar -PbuildNumber=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk out/MyShop-Bazaar.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort | tail -n1)
          if [ -n "$aapt" ]; then
            "$aapt" dump permissions out/MyShop-Bazaar.apk | tee "$RUNNER_TEMP/perms.txt"
            if grep -q REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/perms.txt"; then
              echo "::error::نسخهٔ بازار هنوز اجازهٔ نصبِ بسته دارد"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Tohid-Native
          path: android-native/out/*
          if-no-files-found: error
          retention-days: 30

      # ⛔ فقط از main به گوشی‌ها می‌رسد. پیش‌تر هر push روی شاخه‌ی
      # `claude/**` برچسب را جابه‌جا و APK را جایگزین می‌کرد؛ یعنی کارِ
      # نیمه‌تمام و بازبینی‌نشده خودکار روی گوشیِ همه‌ی دکان‌ها می‌نشست.
      # شاخه‌ها فقط ساخته و سنجیده می‌شوند (و APK به‌عنوانِ artifact می‌ماند).
      - name: جابه‌جا کردن برچسب
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
                 -f sha='${{ github.sha }}' -F force=true >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha='${{ github.sha }}' >/dev/null
          fi

      # ⚠️ چرا فایل‌ها با خودِ action-gh-release نمی‌روند: آن action همهٔ
      # فایل‌ها را **هم‌زمان** می‌فرستد و پیش از هر کدام فایلِ هم‌نامِ قبلی را
      # پاک می‌کند. دو بار (۳.۲.۲۵۳ و ۳.۲.۲۵۵) وسطِ همین کار «Error saving
      # asset» داد و نتیجه‌اش بدترین حالت بود: `version.txt`ِ تازه روی
      # انتشار نشست ولی `Tohid-Native.apk` پاک شده و دوباره نیامده بود — پس
      # برنامهٔ روی گوشی «نسخهٔ تازه هست» می‌دید و دانلودش ۴۰۴ می‌گرفت.
      # («برای برنامهٔ فروشگاه آپدیتی نیومد.»)
      #
      # این‌جا فایل‌ها **یکی‌یکی** و با ترتیبِ درست می‌روند: اول خودِ نصبی‌ها،
      # آخر از همه `version.txt` — تا هیچ لحظه‌ای شماره‌ای اعلام نشود که
      # فایلش هنوز نیامده. هر فایل تا سه بار تلاش می‌شود.
      - name: انتشار
        if: ${{ env.PUBLISH == 'true' && env.CHANNEL == 'stable' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tohid-native
          name: توحید — نسخهٔ بومی اندروید
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ## توحید — نسخهٔ بومی اندروید

            بازنویسی کامل با Kotlin و Jetpack Compose. بدون HTML، بدون WebView.

            **دانلود:** [MyShop-Android.apk](https://github.com/${{ github.repository }}/releases/download/tohid-native/MyShop-Android.apk) — نسخهٔ `${{ env.APK_NAME }}`، حدود ${{ env.APK_MB }} مگابایت

            > این لینک همیشه تازه‌ترین نسخه را می‌دهد و با ساختِ بعدی نمی‌میرد.

            > این نسخه **در حال ساخت** است. مرحله‌به‌مرحله کامل می‌شود و هر
            > مرحله از داخل خود برنامه به‌روزرسانی می‌گیرد.

            ---
            <sub>ساخته‌شده از `${{ github.sha }}`</sub>

      - name: انتشارِ آزمایشی
        if: ${{ env.PUBLISH == 'true' && env.CHANNEL == 'beta' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tohid-native-beta
          name: توحید — نسخهٔ آزمایشی اندروید (beta)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            ## نسخهٔ آزمایشی — فقط دکان‌ها و دستگاه‌های آزمایشی

            هر مرج به main این‌جا می‌آید، نه روی گوشیِ همه. دکانی که شناسه‌اش در
            `live_config` (scope `release`، کلیدِ `beta.shops` یا `beta.devices`) باشد
            این نسخه را از به‌روزرسانیِ داخلِ برنامه می‌گیرد. انتشارِ پایدار برای همه فقط
            با Run workflow ⇒ channel = stable.

            > نامِ فایل عمداً به `.apk.beta` ختم می‌شود تا برنامه‌های قدیمی که از
            > api.github.com می‌پرسند آن را برندارند.

            ---
            <sub>نسخهٔ `${{ env.APK_NAME }}` — ساخته‌شده از `${{ github.sha }}`</sub>

      - name: فرستادنِ فایل‌ها — یکی‌یکی، version.txt آخر
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: android-native/out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          up() {
            for i in 1 2 3; do
              if gh release upload "$TAG" "$1" --clobber -R "${{ github.repository }}"; then return 0; fi
              echo "::warning::فرستادنِ $1 نشد (تلاش $i) — دوباره"
              sleep $((i * 5))
            done
            echo "::error::فرستادنِ $1 بعد از سه تلاش نشد"
            return 1
          }
          up "${{ env.APK_NAME }}"
          if [ "$CHANNEL" = beta ]; then
            #  آزمایشی: فقط نصبیِ نسخه‌دار، فهرست، امضا و شماره — هیچ `.apk`ی
            up SHA256SUMS.txt
            if [ -f SHA256SUMS.txt.sig ]; then up SHA256SUMS.txt.sig; fi
            up version.txt
            names=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.assets[].name')
            for f in "${{ env.APK_NAME }}" SHA256SUMS.txt version.txt; do
              echo "$names" | grep -qx "$f" || { echo "::error::$f روی انتشار نیست"; exit 1; }
            done
            echo "$names" | grep -qi '\.apk$' && { echo "::error::انتشارِ آزمایشی نباید فایلِ .apk داشته باشد"; exit 1; }
            echo "هر سه فایل روی انتشارِ آزمایشی است"
            exit 0
          fi
          up Tohid-Native.apk
          #  نامِ رو به کاربر «فروشگاه من» است؛ «Tohid-Native.apk» فقط برای به‌روزرسانیِ نسخه‌های نصب‌شده می‌ماند
          cp Tohid-Native.apk MyShop-Android.apk
          up MyShop-Android.apk
          #  نسخهٔ کافه‌بازار — برای بارگذاری در پنلِ بازار، نه برای به‌روزرسانیِ گوشی‌ها
          up MyShop-Bazaar.apk
          up SHA256SUMS.txt
          if [ -f SHA256SUMS.txt.sig ]; then up SHA256SUMS.txt.sig; fi
          up version.txt
          #  و از خودِ گیت‌هاب بپرس که هر سه واقعاً روی انتشار نشسته‌اند
          names=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" | jq -r '.assets[].name')
          for f in "${{ env.APK_NAME }}" Tohid-Native.apk SHA256SUMS.txt version.txt; do
            echo "$names" | grep -qx "$f" || { echo "::error::$f روی انتشار نیست"; exit 1; }
          done
          echo "هر چهار فایل روی انتشار است"

      - name: پاک کردن نسخه‌های قبلی
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #  هر چیزی جز فایل‌های همین ساخت برداشته می‌شود. «Tohid-Native.apk»
          #  و «version.txt» همیشه می‌مانند — لینکِ ثابت و شمارهٔ نسخه به
          #  آنها بسته است.
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            | jq -r '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
              case "$name" in
                "${{ env.APK_NAME }}"|Tohid-Native.apk|MyShop-Android.apk|MyShop-Bazaar.apk|SHA256SUMS.txt|SHA256SUMS.txt.sig|version.txt) ;;
                *) gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" ;;
              esac
            done
