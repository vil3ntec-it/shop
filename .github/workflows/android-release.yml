name: Android release

# نسخه‌ی رسمی: با زدن یک تگ مثل v1.0.1 ساخته و روی Releases گذاشته می‌شود.
# برنامه‌ی نصب‌شده روی گوشی همین Release را می‌بیند و به‌روزرسانی را پیشنهاد می‌دهد.
# ⛔ بازنشسته (۱۴۰۵/۰۷/۲۰): این پوستهٔ WebView است و قاعدهٔ صاحب مخزن این است
# که برنامهٔ اندروید «حتی یک درصد» وب نباشد. برنامهٔ اندروید `android-native/`
# است (`tohid-native.yml`). دیگر با برچسب خودکار منتشر نمی‌شود؛ فقط دستی.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "نسخه (مثلاً 1.0.1)"
        required: true

#  ⛔ §۱۴ (docs/security/supply-fa.md): پیش‌فرض خواندنی؛ نوشتن فقط در همین کارِ انتشار و فقط از main.
permissions:
  contents: read

jobs:
  release:
    #  پیش‌تر Run workflow از هر شاخه‌ای انتشارِ `v*` (غیرِ prerelease ⇒ «Latest» ِ مخزن) می‌ساخت.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      #  ورودی از env و فقط به شکلِ شمارهٔ نسخه — نه تزریقِ فرمان در run، نه نامِ برچسبِ دلخواه
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::نسخه باید فقط عدد و نقطه باشد (مثلاً 1.0.1)"; exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        # اگر امضای رسمی تنظیم نشده باشد، بیلد با امضای debug ادامه می‌دهد
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 تنظیم نشده — خروجی با امضای debug ساخته می‌شود."
          fi

      - name: Build release APK
        working-directory: android
        env:
          TOHID_VERSION_NAME: ${{ steps.ver.outputs.value }}
          TOHID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TOHID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TOHID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TOHID_SIGNING: ${{ steps.keystore.outputs.present }}
          # اگر متغیر مخزن SHOP_SERVER_URL تنظیم شده باشد، همان آدرس به‌عنوان
          # پیش‌فرض داخل نسخه می‌رود؛ کاربر باز هم می‌تواند از داخل برنامه عوضش کند.
          SHOP_SERVER_URL: ${{ vars.SHOP_SERVER_URL }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk/release -name "*.apk" -exec \
            cp {} "out/shop-${{ steps.ver.outputs.value }}.apk" \;
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # با workflow_dispatch هم درست کار کند: تگ از شماره‌ی نسخه ساخته می‌شود
          tag_name: v${{ steps.ver.outputs.value }}
          name: shop ${{ steps.ver.outputs.value }}
          generate_release_notes: true
          files: out/*.apk
