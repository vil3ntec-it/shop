name: سرور

# ⛔ تا امروز `server/` هیچ ورک‌فلویی نداشت.
#
# یعنی سیصد و چند آزمونِ سرور فقط وقتی می‌دویدند که کسی دستی
# `npm test` بزند — و قاعدهٔ خودِ صاحب مخزن («اگر تست رد شده، مرج
# نشود») عملاً هیچ‌وقت سنجیده نمی‌شد. هر PRای سبز به‌نظر می‌رسید
# چون هیچ‌چیزی آن را نمی‌سنجید.

on:
  push:
    #  شاخه‌های claude/** فقط از راهِ PR سنجیده می‌شوند (اجرای دوتایی صفِ Actions را چند ساعت عقب انداخت)
    branches: [main]
    paths:
      - 'server/**'
      - 'index.html'
      - 'sw.js'
      - 'license/**'
      - 'core/test-vectors/**'
      # نام‌های فارسیِ خروجیِ کاملِ مالک با نسخهٔ وب سنجیده می‌شوند (owner-export.test.js)
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/data/OwnerExport.kt'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'index.html'
      - 'sw.js'
      - 'license/**'
      - 'core/test-vectors/**'
      # نام‌های فارسیِ خروجیِ کاملِ مالک با نسخهٔ وب سنجیده می‌شوند (owner-export.test.js)
      - 'android-native/app/src/main/java/ir/vil3ntec/tohid/data/OwnerExport.kt'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  #  PR: pushِ تازه اجرای قبلیِ همان PR را لغو می‌کند. اجرای main (و برچسب‌ها) هرگز وسطِ کار لغو نمی‌شود.
  group: server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ⛔ تا ۱۴۰۵/۰۷/۲۷ همهٔ این‌ها در یک کار و پشتِ‌سرِهم می‌دوید (PostgreSQL، PGlite،
  # Electron، کرومیوم و سناریوهای سرتاسری) و با رشدِ آزمون‌ها به سقفِ ۵۰ دقیقه می‌خورد ⇒
  # «لغو» بی هیچ آزمونِ قرمزی. حالا پنج کارِ هم‌زمان‌اند و کارِ پایانی با همان نامِ
  # همیشگی («آزمون‌های سرور») فقط وقتی سبز است که همه سبز باشند — پس قاعدهٔ مرج و نامِ
  # چکی که منتظرش هستیم عوض نمی‌شود.
  pg:
    name: آزمون‌های سرور روی PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shoppass
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shop:shoppass@127.0.0.1:5432/shop_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      #  ⛔ §۱۴: فقط از قفل (`package-lock.json`)؛ پیش‌تر `|| npm install` قفلِ ناهم‌خوان را بی صدا دور می‌زد
      - name: نصبِ وابستگی‌ها
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: آزمون‌های سرور
        working-directory: server
        run: npm test

  pglite:
    name: آزمون‌های سرور روی PGlite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        working-directory: server
        run: npm ci --no-audit --no-fund

      # همان آزمون‌ها روی PGlite — راهی که پنلِ سرورِ خانگی این سرور را با آن
      # بالا می‌آورد (بی داکر، بی PostgreSQL). اگر SQLی فقط روی pg کار کند،
      # این‌جا سرخ می‌شود، نه روی کامپیوترِ صاحبِ سامانه.
      - name: آزمون‌های سرور روی PGlite
        working-directory: server
        run: npm run test:pglite

  electron:
    name: آزمون‌های سرور زیرِ Electron
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        working-directory: server
        run: npm ci --no-audit --no-fund

      # ⛔ **و همان آزمون‌ها زیرِ خودِ Electron** — همان Nodeی که مرکز فرمان
      # این سرور را با آن بالا می‌آورد (`ELECTRON_RUN_AS_NODE`). کتابخانهٔ رمزش
      # BoringSSL است، نه OpenSSL، و `crypto.sign(null, …)` آن‌جا می‌افتاد:
      # هر مجوزی ۵۰۰ می‌داد و هیچ اشتراکی به هیچ برنامه‌ای نمی‌رسید، در حالی
      # که همهٔ آزمون‌های بالا سبز بودند (۱۴۰۵/۰۷/۱۵). نسخهٔ Electron همان
      # بازهٔ `homelab-panel/desktop/package.json`ِ ریپوی server است.
      - name: آزمون‌های سرور زیرِ Electron (Nodeِ مرکز فرمان)
        working-directory: server
        run: |
          npm install -g electron@38
          ELECTRON_RUN_AS_NODE=1 "$(npm root -g)/electron/dist/electron" -e "console.log('electron', process.versions.electron, 'openssl', process.versions.openssl)"
          ELECTRON_RUN_AS_NODE=1 "$(npm root -g)/electron/dist/electron" scripts/test-pglite.js

  browser:
    name: آزمون‌های مرورگر (پنل، وب، ویترین) و باتِ پمپ
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shoppass
          POSTGRES_DB: shop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shop:shoppass@127.0.0.1:5432/shop_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        working-directory: server
        run: npm ci --no-audit --no-fund

      # پنل جاوااسکریپتِ مرورگر است و هیچ آزمونِ سمتِ سروری آن را
      # نمی‌سنجد: یک `onclick`ِ جانشانده یا یک شناسه‌ی غلط فقط وقتی
      # پیدا می‌شد که صاحبِ سامانه دکمه را می‌زد و هیچ اتفاقی نمی‌افتاد.
      # ⚠️ سراسری نصب می‌شود، نه در `server/`: سرور عمداً فقط دو
      # وابستگی دارد و یک `devDependency`ی چندصد مگابایتی همان قاعده
      # را می‌شکست. خودِ سنجه از `npm root -g` پیدایش می‌کند.
      # F0-17: نبودِ پلی‌رایت یا axe-core حالا آزمون را **قرمز** می‌کند
      # (`server/test/browser-guard.mjs`)، نه «رد» با کدِ ۰.
      - name: کرومیوم برای آزمونِ پنل
        run: |
          npm install -g playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: آزمونِ پنلِ مدیریت
        working-directory: server
        run: npm run test:panel

      # نسخهٔ وب همان برنامه است روی مرورگر — نه یک نسخهٔ ساده‌شده.
      # کاربرانِ آیفون فقط همین را دارند، پس نبودنِ سنجه برای آن یعنی
      # نصفِ کاربرها بی‌آزمون می‌مانند.
      - name: آزمونِ نسخهٔ وب
        working-directory: server
        run: npm run test:web

      # F0-17: چیدمان (بی بیرون‌زدگی در ۳۲۰ تا ۱۳۶۶) و دسترس‌پذیری (axe-core)
      # نسخهٔ وب — تا امروز فقط دستی می‌دوید.
      - name: آزمونِ چیدمان و دسترس‌پذیریِ نسخهٔ وب
        working-directory: server
        run: npm run test:web-ui

      # F0-23 (دنباله): دفترِ وب در IndexedDB — آزمایشی و پیش‌فرض خاموش. انتقال،
      # بارِ دوباره، خروجی/بازیابی، برگشت، نبودِ IndexedDB، سهمیه و دفترِ دیررس.
      - name: آزمونِ دفترِ وب در IndexedDB
        working-directory: server
        run: npm run test:web-idb

      # OPS-08: خروجیِ کاملِ مالک (اکسل و JSON) با دکمهٔ واقعی در کرومیوم —
      # فایلِ دانلودشده باز و سنجیده می‌شود، و دفتر نباید عوض شود.
      - name: آزمونِ خروجیِ کاملِ مالک در نسخهٔ وب
        working-directory: server
        run: npm run test:web-export

      # شورا چ۳: نمایندهٔ فروش در پورتال فقط فروش‌های خودش را می‌بیند
      - name: آزمونِ نمایندگی در پورتال
        working-directory: server
        run: npm run test:portal-rep

      # فاز ۴: ویترین با کرومیومِ واقعی — از کاتالوگ تا رسید، CSP ِ سخت،
      # بی بیرون‌زدگی در ۳۲۰ تا ۱۲۸۰، و دسترس‌پذیری (axe-core)
      - name: آزمونِ ویترین
        working-directory: server
        run: npm run test:web-store

      # بازارچه (WEB، §۲۳): از خانه تا لغوِ سفارش با کرومیومِ واقعی — جداییِ دکان‌ها،
      # سبدِ ماندگار، قیمتِ عوض‌شده (۴۰۹)، پیگیری، CSP ِ سخت، axe روشن/تاریک، بی بیرون‌زدگی
      - name: آزمونِ بازارچه
        working-directory: server
        run: npm run test:web-market

      # باتِ پمپ در ریپوی پمپ است (telegram-bot/) ولی داخلِ همین سرور اجرا می‌شود؛
      # پس هر تغییرِ سرورِ حساب با آزمون‌های خودِ بات هم سنجیده می‌شود تا بات نشکند.
      # ریپوی پمپ عمومی است. بات هنوز آن‌جا نیامده ⇒ این گام فقط خبر می‌دهد.
      - name: باتِ پمپ (از ریپوی پمپ) روی همین سرور
        run: |
          git clone -q --depth 1 https://github.com/vil3ntec-it/pump-staion-yaqobi.git /tmp/pump
          if [ ! -f /tmp/pump/telegram-bot/run-tests.sh ]; then
            echo "::notice::باتِ پمپ هنوز در ریپوی پمپ نیست — رد شد"
            exit 0
          fi
          SHOP_SERVER="$GITHUB_WORKSPACE/server" TEST_DATABASE_URL=pglite:memory bash /tmp/pump/telegram-bot/run-tests.sh

  e2e:
    name: سناریوهای سرتاسری (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: نصبِ وابستگی‌ها
        working-directory: server
        run: npm ci --no-audit --no-fund

      # پنل جاوااسکریپتِ مرورگر است و هیچ آزمونِ سمتِ سروری آن را
      # نمی‌سنجد: یک `onclick`ِ جانشانده یا یک شناسه‌ی غلط فقط وقتی
      # پیدا می‌شد که صاحبِ سامانه دکمه را می‌زد و هیچ اتفاقی نمی‌افتاد.
      # ⚠️ سراسری نصب می‌شود، نه در `server/`: سرور عمداً فقط دو
      # وابستگی دارد و یک `devDependency`ی چندصد مگابایتی همان قاعده
      # را می‌شکست. خودِ سنجه از `npm root -g` پیدایش می‌کند.
      # F0-17: نبودِ پلی‌رایت یا axe-core حالا آزمون را **قرمز** می‌کند
      # (`server/test/browser-guard.mjs`)، نه «رد» با کدِ ۰.
      - name: کرومیوم برای آزمونِ پنل
        run: |
          npm install -g playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium

      # سناریوهای سرتاسری (E2E-*، S*): دستگاه‌های برنامهٔ دکان در سطحِ پروتکل (همان opها، JSON و
      # سرآیندهای اندروید/کامپیوتر)، ویترین و پنلِ مدیر در کرومیوم. هر سناریو PGlite ِ خودش را دارد
      # و چند تا هم‌زمان می‌دوند (TEST_DATABASE_URL ِ بالا را نمی‌خوانند). جدولِ گام‌ها در لاگ؛
      # «شکافِ شناخته» (test/e2e/lib/known-gaps.mjs) قرمز نیست ولی دیده می‌شود.
      - name: سناریوهای سرتاسری (E2E)
        working-directory: server
        env:
          E2E_RESULTS_DIR: ${{ runner.temp }}/e2e
        run: npm run test:e2e

      - name: نتیجه و عکس‌های سناریوهای سرتاسری
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: آزمون‌های سرور
    runs-on: ubuntu-latest
    needs: [pg, pglite, electron, browser, e2e]
    if: always()
    timeout-minutes: 5
    steps:
      - name: همهٔ کارهای آزمون سبزند؟
        run: |
          echo '${{ toJSON(needs) }}'
          for r in "${{ needs.pg.result }}" "${{ needs.pglite.result }}" "${{ needs.electron.result }}" "${{ needs.browser.result }}" "${{ needs.e2e.result }}"; do
            [ "$r" = "success" ] || { echo "::error::یکی از کارهای آزمون سبز نیست: $r"; exit 1; }
          done
